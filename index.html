$(document).on('keypress', function(event){	
	if(event.target.className.includes('AMT')){
		var regex = /^\d{1,11}(\.\d{0,2})?$/;
		var value = event.target.value;
		if(value != 0 && value !=''){
		console.log(value)
		console.log(regex.test(value))
		if (!regex.test(value)) {
			return false;
		}
		}
	}
	
});
