<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>XML to XSL Converter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    textarea {
      width: 100%;
      height: 200px;
      margin-bottom: 10px;
      font-family: monospace;
    }
    #output {
      white-space: pre-wrap;
      background: #f0f0f0;
      padding: 10px;
      border: 1px solid #ccc;
    }
    button {
      padding: 8px 16px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <h2>XML to XSL Converter</h2>
  <textarea id="inputXml" placeholder="Paste your XML tags here..."></textarea>
  <br>
  <button onclick="convert()">Convert</button>
  <h3>Converted XSL:</h3>
  <div id="output"></div>

  <script>
    function convertXmlToXsl(xmlString) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(`<root>${xmlString}</root>`, "application/xml");
      const elements = xmlDoc.documentElement.children;
      let output = "";

      for (let elem of elements) {
        const tagName = elem.tagName;
        const value = elem.textContent.trim();
        output += `<xsl:element name="${tagName}"><xsl:value-of select="/root/domData/${value}"/></xsl:element>\n`;
      }

      return output.trim();
    }

    function convert() {
      const input = document.getElementById("inputXml").value;
      const result = convertXmlToXsl(input);
      document.getElementById("output").textContent = result;
    }
  </script>

</body>
</html>
