function csrfResolution(url){
	var csrfDataArray = encodeUrl(url).split("?")[1].split("&");
	var CSRFData = csrfDataArray[0].split("=");
	var refreshTokenData = csrfDataArray[1].split("=");
	var csrfObject = {"url":url,"csrf":CSRFData[1],"refreshToken":refreshTokenData[1]};
	return csrfObject;
}
