function SYF_FWCO_isValueInDropdown(selectId,valueToCheck) {
    try {
        var sel = document.getElementById(selectId);
		
		for(var opt of sel.options){
			if(opt.value == valueToCheck){
				return true;
			}
			return false;
		}
    } catch (e) {
        DisExcpt("SYF_FWCO_BRU_BOOK_FC_TF.js*SYF_FWCO_isValueInDropdown", e);
    }
}
