<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IR File Tracker</title>

<style>
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:20px;
    color:#222;
  }

  .container{
    max-width:900px;
    margin:auto;
  }

  h1{
    margin-bottom:20px;
    font-size:24px;
  }

  .top{
    display:flex;
    gap:10px;
    margin-bottom:15px;
  }

  input{
    flex:1;
    padding:10px;
    border:1px solid #ccc;
    border-radius:4px;
    font-size:14px;
  }

  button{
    padding:10px 16px;
    border:none;
    background:#222;
    color:#fff;
    cursor:pointer;
    border-radius:4px;
  }

  button:disabled{
    opacity:.5;
    cursor:not-allowed;
  }

  .status{
    margin-bottom:15px;
    font-size:14px;
  }

  .toolbar{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
  }

  .file-list{
    background:#fff;
    border:1px solid #ddd;
    border-radius:4px;
    overflow:hidden;
  }

  .file-item{
    padding:10px;
    border-bottom:1px solid #eee;
    font-size:14px;
    word-break:break-all;
  }

  .file-item:last-child{
    border-bottom:none;
  }

  .empty{
    padding:20px;
    text-align:center;
    color:#777;
  }

  .search{
    margin-bottom:10px;
  }

  .raw{
    margin-top:15px;
    padding:10px;
    background:#fff;
    border:1px solid #ddd;
    border-radius:4px;
    font-size:12px;
    white-space:pre-wrap;
    display:none;
    max-height:200px;
    overflow:auto;
  }
</style>
</head>

<body>

<div class="container">

  <h1>IR File Tracker</h1>

  <div class="top">
    <input
      type="text"
      id="irInput"
      placeholder="25110040 or 26020167,25110040"
    />
    <button id="fetchBtn" onclick="runFetch()">Fetch</button>
  </div>

  <div class="status" id="status">
    Enter IR number(s)
  </div>

  <div id="results" style="display:none;">

    <div class="toolbar">
      <div>
        Files: <span id="count">0</span>
      </div>

      <div>
        <button onclick="copyAll()">Copy</button>
        <button onclick="toggleRaw()">Raw</button>
        <button onclick="clearResults()">Clear</button>
      </div>
    </div>

    <div class="search">
      <input
        type="text"
        id="searchInput"
        placeholder="Search files..."
        oninput="filterFiles()"
      />
    </div>

    <div class="file-list" id="fileList"></div>

    <div class="raw" id="rawBox"></div>

  </div>

</div>

<script>
const BASE = 'https://irtracking.statebanktimes.in';
const CGI  = BASE + '/CGI/Get%20Details/getCompsFromNewJournal_TF.cgi?ir=';
const LIST = BASE + '/TMP/Component_List_NEWPVCS_TF.txt';

let allFiles = [];

function setStatus(msg){
  document.getElementById('status').textContent = msg;
}

function renderFiles(files){
  const list = document.getElementById('fileList');

  if(!files.length){
    list.innerHTML = '<div class="empty">No files found</div>';
    return;
  }

  list.innerHTML = files.map(f =>
    `<div class="file-item">${f}</div>`
  ).join('');
}

function filterFiles(){
  const q = document
    .getElementById('searchInput')
    .value
    .toLowerCase();

  renderFiles(
    allFiles.filter(f =>
      f.toLowerCase().includes(q)
    )
  );
}

function copyAll(){
  navigator.clipboard.writeText(allFiles.join('\n'));
  setStatus('Copied to clipboard');
}

function clearResults(){
  allFiles = [];
  document.getElementById('results').style.display = 'none';
  setStatus('Cleared');
}

function toggleRaw(){
  const box = document.getElementById('rawBox');

  box.style.display =
    box.style.display === 'block'
      ? 'none'
      : 'block';
}

async function runFetch(){

  const raw = document
    .getElementById('irInput')
    .value
    .trim();

  if(!raw){
    setStatus('Enter IR number');
    return;
  }

  const btn = document.getElementById('fetchBtn');
  btn.disabled = true;

  const irs = raw
    .split(/[\s,]+/)
    .filter(Boolean);

  const param = irs
    .map(encodeURIComponent)
    .join('%2C');

  setStatus('Triggering CGI...');

  try{
    await fetch(CGI + param,{
      mode:'no-cors',
      cache:'no-store'
    });
  }catch(e){}

  await new Promise(r => setTimeout(r,800));

  setStatus('Fetching file list...');

  try{

    const resp = await fetch(
      LIST + '?t=' + Date.now(),
      { cache:'no-store' }
    );

    if(!resp.ok){
      throw new Error(resp.status);
    }

    const text = await resp.text();

    allFiles = text
      .split('\n')
      .map(v => v.trim())
      .filter(Boolean);

    document.getElementById('count').textContent =
      allFiles.length;

    document.getElementById('rawBox').textContent =
      text;

    renderFiles(allFiles);

    document.getElementById('results').style.display =
      'block';

    setStatus('Done');

  }catch(e){

    setStatus('Failed: ' + e.message);

  }

  btn.disabled = false;
}

document
  .getElementById('irInput')
  .addEventListener('keydown',e => {
    if(e.key === 'Enter'){
      runFetch();
    }
  });
</script>

</body>
</html>
