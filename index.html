<script>
  function normalizeTableInPanel(panelHtml) {
    const wrapper = document.createElement('div');
    wrapper.innerHTML = panelHtml;

    const tables = wrapper.querySelectorAll('table');
    tables.forEach(table => {
      const tbody = table.querySelector('tbody');
      if (!tbody) return;

      const rows = Array.from(tbody.querySelectorAll('tr'));
      const newRows = [];

      rows.forEach(row => {
        const cells = Array.from(row.children);
        if (cells.length <= 2) {
          newRows.push(row.cloneNode(true));
        } else {
          for (let i = 0; i < cells.length; i += 2) {
            const newRow = document.createElement('tr');
            const labelTd = cells[i].cloneNode(true);
            const valueTd = cells[i + 1] ? cells[i + 1].cloneNode(true) : document.createElement('td');
            newRow.appendChild(labelTd);
            newRow.appendChild(valueTd);
            newRows.push(newRow);
          }
        }
      });

      tbody.innerHTML = '';
      newRows.forEach(row => tbody.appendChild(row));
    });

    return wrapper.innerHTML;
  }

  function convertHtml() {
    let inputHtml = document.getElementById('inputHtml').value;

    const panelRegex = /<div[^>]*class=["']panel["'][^>]*>[\s\S]*?<\/div>/gi;

    const outputHtml = inputHtml.replace(panelRegex, (panelDivHtml) => {
      return normalizeTableInPanel(panelDivHtml);
    });

    document.getElementById('output').textContent = outputHtml;
  }
</script>
