<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Customer Support Chat</title>
  <link rel="stylesheet" href="custStyles.css">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Minimal inline styles for quick preview - keep your custStyles.css for production */
    .chat-container { max-width: 720px; margin: 12px auto; border: 1px solid #ddd; border-radius: 8px; overflow:hidden; display:flex; flex-direction:column; height:80vh; }
    .chat-header { padding:12px; background:#f7f7f7; border-bottom:1px solid #eee; }
    .chat-messages { padding:12px; flex:1; overflow:auto; background:#fff; }
    .chat-input { padding:10px; border-top:1px solid #eee; background:#fafafa; }
    .message { margin-bottom:10px; }
    .message.customer { text-align:right; }
    .message.bank { text-align:left; }
    .message-sender { font-size:12px; color:#666; }
    .message-content { display:inline-block; padding:8px 12px; border-radius:12px; margin-top:4px; max-width:70%; }
    .customer .message-content { background:#d1ffd8; }
    .bank .message-content { background:#eef2ff; }
    .connection-status { font-size:12px; margin-top:6px; color:#444; }
    .default-questions { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    .question-btn { padding:6px 10px; border-radius:6px; border:1px solid #ccc; background:#fff; cursor:pointer; }
    .input-container { display:flex; gap:8px; }
    .message-input { flex:1; padding:8px; border-radius:4px; border:1px solid #ccc; }
    .send-button { padding:8px 12px; border-radius:4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Utility: read query param
    const getUrlParameter = (name) => {
      name = name.replace(/[\\[]/, '\\[').replace(/[\\]]/, '\\]');
      const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
      const results = regex.exec(window.location.search);
      return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    };

    function CustomerChat() {
      const [messages, setMessages] = useState([]);
      const [inputMessage, setInputMessage] = useState('');
      const [connectionStatus, setConnectionStatus] = useState('connecting'); // connecting | connected | disconnected | error
      const [customerId, setCustomerId] = useState('');
      const [branchCode, setBranchCode] = useState('');
      const [userInfo, setUserInfo] = useState(null);
      const [isBrConnected, setIsBrConnected] = useState(false);
      const [showDefaultQuestions, setShowDefaultQuestions] = useState(false);

      // refs
      const wsRef = useRef(null);
      const reconnectTimerRef = useRef(null);
      const isMountedRef = useRef(false);
      const messageQueueRef = useRef([]); // queue messages until socket open
      const messagesEndRef = useRef(null);

      const defaultQuestions = [
        "Check account balance",
        "View last 5 transactions",
        "Report an issue",
        "Talk to customer support"
      ];

      // extract params once on mount
      useEffect(() => {
        const urlCustomerId = getUrlParameter('cust_id');
        const urlBranchCode = getUrlParameter('branch_code');
        const urlCustName = getUrlParameter('cust_name');

        setCustomerId(urlCustomerId);
        setBranchCode(urlBranchCode);
        setUserInfo({
          customerId: urlCustomerId,
          branchCode: urlBranchCode,
          custName: urlCustName
        });

        isMountedRef.current = true;
        return () => {
          isMountedRef.current = false;
          if (reconnectTimerRef.current) clearTimeout(reconnectTimerRef.current);
          if (wsRef.current) {
            try { wsRef.current.close(); } catch(e) {}
            wsRef.current = null;
          }
        };
      }, []);

      // whenever we have customerId & branchCode, start websocket + load previous messages
      useEffect(() => {
        if (!customerId || !branchCode) return;

        connectWebSocket();
        loadPreviousMessages(customerId, branchCode);

        // don't close ws here; cleanup handled in mount effect
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [customerId, branchCode]);

      // scroll to bottom on messages change
      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      // --- WebSocket / messaging helpers ---
      const WS_URL = `ws://10.177.141.86:7001/ChatboxEECE/chatServer`; // update for prod (use wss:// on https)

      const connectWebSocket = () => {
        try {
          // avoid creating new socket if already connecting or open
          if (wsRef.current && (wsRef.current.readyState === WebSocket.OPEN || wsRef.current.readyState === WebSocket.CONNECTING)) {
            return;
          }

          setConnectionStatus('connecting');
          const websocket = new WebSocket(WS_URL);

          websocket.onopen = () => {
            setConnectionStatus('connected');
            // register user
            const reg = {
              type: 'register',
              role: 'customer',
              customerId,
              branchCode,
              customerName: userInfo?.custName || ''
            };
            safeSend(reg);
            // flush any queued messages
            flushQueue();
          };

          websocket.onmessage = (evt) => {
            try {
              const message = JSON.parse(evt.data);
              handleIncomingMessage(message);
            } catch (err) {
              console.error('Invalid ws message', err);
            }
          };

          websocket.onerror = (err) => {
            console.error('Customer WebSocket error:', err);
            setConnectionStatus('error');
          };

          websocket.onclose = (ev) => {
            console.info('WebSocket closed', ev);
            setConnectionStatus('disconnected');
            // reconnect after delay only if component still mounted
            if (isMountedRef.current) {
              if (reconnectTimerRef.current) clearTimeout(reconnectTimerRef.current);
              reconnectTimerRef.current = setTimeout(() => {
                connectWebSocket();
              }, 3000);
            }
          };

          wsRef.current = websocket;
        } catch (error) {
          console.error('Failed to create customer WebSocket:', error);
          setConnectionStatus('error');
        }
      };

      // safe send: stringifies & checks readyState
      const safeSend = (obj) => {
        const ws = wsRef.current;
        try {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify(obj));
            return true;
          } else {
            // not open - push to queue
            messageQueueRef.current.push(obj);
            return false;
          }
        } catch (err) {
          console.warn('safeSend failed, queued', err);
          messageQueueRef.current.push(obj);
          return false;
        }
      };

      const flushQueue = () => {
        const ws = wsRef.current;
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        while (messageQueueRef.current.length > 0) {
          const obj = messageQueueRef.current.shift();
          try { ws.send(JSON.stringify(obj)); } catch(e) { console.error('flush send failed', e); messageQueueRef.current.unshift(obj); break; }
        }
      };

      const handleIncomingMessage = (message) => {
        // ensure messages belong to this customer
        if (message.customerId && String(message.customerId) !== String(customerId)) return;

        if (message.type === 'message') {
          const newMessage = {
            content: message.content,
            isCustomer: message.sender === 'customer',
            senderName: message.sender === 'bank' ? (message.brCode || 'Branch') : (message.customerName || 'Customer'),
            timestamp: message.timestamp || new Date().toISOString()
          };
          setMessages(prev => [...prev, newMessage]);
          setIsBrConnected(true);
        } else {
          handleBotResponse(message);
        }
      };

      const handleBotResponse = (message) => {
        if (!message) return;
        if (message.type === 'ANSWER') {
          const newMessage = {
            content: message.answer,
            senderName: "System",
            isCustomer: false,
            timestamp: new Date().toISOString()
          };
          setMessages(prev => [...prev, newMessage]);
        } else if (message.type === 'COUNTER_FLOW' && Array.isArray(message.flow)) {
          // store buttons as text entries (rendered as buttons in message list)
          const flowOptions = message.flow.map((opt, idx) => ({ id: `flow-${idx}-${Date.now()}`, option: opt }));
          // we'll push a "system" message that contains the options array for special rendering
          setMessages(prev => [...prev, {
            content: flowOptions,
            senderName: "System",
            isCustomer: false,
            timestamp: new Date().toISOString()
          }]);
        } else if (message.type === 'HUMAN') {
          const newMessage = {
            content: message.answer,
            senderName: "System",
            isCustomer: false,
            timestamp: new Date().toISOString()
          };
          setMessages(prev => [...prev, newMessage]);
        } else {
          // fallback: push raw
          setMessages(prev => [...prev, {
            content: JSON.stringify(message),
            senderName: "System",
            isCustomer: false,
            timestamp: new Date().toISOString()
          }]);
        }
      };

      // load previous messages (fixed redeclaration & error handling)
      const loadPreviousMessages = async (custId, brCode) => {
        try {
          const response = await fetch(`./LoadPreviousMesgs?cust_id=${custId}&branch_code=${brCode}&req_from=customer`);
          if (!response.ok) throw new Error('Failed to fetch previous messages');

          const data = await response.json();

          let formattedMessages = [];

          if (data && data.error === 'Invalid Customer ID Please check') {
            // trigger connection alert to branch
            handleConnAlert();
          } else if (Array.isArray(data)) {
            const filtered = data.filter(msg => String(msg.custID1) === String(custId));
            filtered.sort((a, b) => new Date(a.date) - new Date(b.date));
            formattedMessages = filtered.map(msg => ({
              content: msg.message,
              isCustomer: String(msg.sender).toLowerCase() === 'customer',
              senderName: msg.sender === 'bank' ? msg.brCode : msg.custName,
              timestamp: msg.date
            }));
          }

          setMessages(prev => ([
            {
              content: "Welcome! How can we help you today?",
              isCustomer: false,
              senderName: "System",
              timestamp: new Date().toISOString()
            },
            ...formattedMessages,
            ...prev
          ]));

          // show default questions once
          setShowDefaultQuestions(true);

        } catch (error) {
          console.error('Error loading previous messages:', error);
        }
      };

      // If branch not connected, we store message to call bot endpoint; if branch connected, send over ws
      const handleOutGoingMsg = (text) => {
        if (!text || !text.trim()) return;

        const trimmed = text.trim();

        const messageData = {
          type: 'message',
          content: trimmed,
          customerId,
          branchCode,
          sender: 'customer',
          timestamp: new Date().toISOString(),
          customerName: userInfo?.custName || ''
        };

        // If branch connected, send via socket; else fallback to bot POST
        if (isBrConnected && wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
          safeSend(messageData);
        } else if (isBrConnected) {
          // branch considered connected but socket not ready: queue
          safeSend(messageData);
        } else {
          // fallback to bot API
          handleOutGoingBotMsg(trimmed);
        }

        // add local message
        setMessages(prev => [...prev, {
          content: trimmed,
          isCustomer: true,
          senderName: userInfo?.custName || 'You',
          timestamp: messageData.timestamp
        }]);
        setInputMessage('');
      };

      // bot fallback POST
      const handleOutGoingBotMsg = async (text) => {
        if (!text.trim()) return;
        try {
          const response = await fetch('./getBotReply', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: text.trim() })
          });
          if (!response.ok) throw new Error('Failed to fetch bot reply');
          const parsedMessage = await response.json(); // already parsed
          handleBotResponse(parsedMessage);
        } catch (error) {
          console.error('Error sending to bot:', error);
          setMessages(prev => [...prev, {
            content: 'Sorry, failed to contact the bot.',
            isCustomer: false,
            senderName: 'System',
            timestamp: new Date().toISOString()
          }]);
        }
      };

      const sendMessage = (text) => {
        if (!text || !text.trim()) return;
        handleOutGoingMsg(text);
      };

      const handleKeyPress = (e) => {
        if (e.key === 'Enter') sendMessage(inputMessage);
      };

      // handle alert to branch (ensures ws is created & message queued/sent)
      const handleConnAlert = () => {
        // prepare message
        const messageData = {
          type: 'cust-alert',
          content: `Hello Branch user, A customer (${customerId}, ${userInfo?.custName || ''}) is connected to the Chat support !`,
          customerId,
          branchCode,
          sender: 'system',
          timestamp: new Date().toISOString(),
          customerName: userInfo?.custName || ''
        };

        // ensure websocket exists (connect if required) and attempt to send (will queue if not open)
        if (!wsRef.current || wsRef.current.readyState === WebSocket.CLOSED) {
          connectWebSocket();
        }
        safeSend(messageData);
      };

      // default question click
      const handleDefaultQuestionClick = (q) => {
        sendMessage(q);
        setShowDefaultQuestions(false);
      };

      // small renderer helper: if content is array of flowOptions, render them as buttons
      const renderMessageContent = (message) => {
        if (Array.isArray(message.content) && message.content.length > 0 && typeof message.content[0] === 'object' && message.content[0].option) {
          return (
            <div className="flow-options">
              {message.content.map((opt, idx) => (
                <button key={opt.id || idx} className="question-btn" onClick={() => sendMessage(opt.option)}>
                  {opt.option}
                </button>
              ))}
            </div>
          );
        }
        return <span>{message.content}</span>;
      };

      return (
        <div className="chat-container" role="region" aria-label="Customer Support Chat">
          <div className="chat-header">
            <h2>Customer Support Chat</h2>
            {userInfo && (
              <div className="user-info">
                Customer Name: {userInfo.custName || '-'} | Branch: {userInfo.branchCode ? `SBIN00${userInfo.branchCode}` : '-'}
              </div>
            )}
            <div className="connection-status">
              {connectionStatus === 'connected' && 'Connected to support'}
              {connectionStatus === 'disconnected' && 'Disconnected - Reconnecting...'}
              {connectionStatus === 'connecting' && 'Connecting...'}
              {connectionStatus === 'error' && 'Connection Error'}
            </div>
          </div>

          <div className="chat-messages" aria-live="polite">
            {messages.map((message, index) => (
              <div key={index} className={`message ${message.isCustomer ? 'customer' : 'bank'}`}>
                <div className="message-sender">{message.senderName || (message.isCustomer ? userInfo?.custName || 'You' : 'Support')}</div>
                <div className="message-content">
                  {renderMessageContent(message)}
                </div>
                <div className="message-time">
                  {new Date(message.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                </div>
              </div>
            ))}

            {showDefaultQuestions && (
              <div className="default-questions" aria-hidden={!showDefaultQuestions}>
                {defaultQuestions.map((q, i) => (
                  <button key={i} className="question-btn" onClick={() => handleDefaultQuestionClick(q)}>{q}</button>
                ))}
              </div>
            )}

            <div ref={messagesEndRef} />
          </div>

          <div className="chat-input">
            <div className="input-container">
              <input
                type="text"
                className="message-input"
                value={inputMessage}
                onChange={(e) => setInputMessage(e.target.value)}
                onKeyPress={handleKeyPress}
                placeholder="Type your message..."
                maxLength="500"
                disabled={connectionStatus === 'error'}
                aria-label="Message input"
              />
              <button
                className="send-button"
                onClick={() => sendMessage(inputMessage)}
                disabled={!inputMessage.trim() || connectionStatus === 'error'}
                aria-label="Send message"
              >
                Send
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CustomerChat />);
  </script>
</body>
</html>
