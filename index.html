textPane.addKeyListener(
        new java.awt.event.KeyAdapter() {

            @Override
            public void keyPressed(
                    java.awt.event.KeyEvent e
            ) {

                if (e.getKeyCode()
                        == java.awt.event.KeyEvent.VK_ENTER) {

                    if (lastFindKeyword != null
                            && !lastFindKeyword.isEmpty()) {

                        findNextOccurrence();

                        e.consume();
                    }
                }
            }
        }
);
