<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Support Chat</title>
  <link rel="stylesheet" href="custStyles.css">
  <!-- React and Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Utility function to get URL parameters
    const getUrlParameter = (name) => {
      name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
      const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
      const results = regex.exec(window.location.search);
      return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    };

    // Default starter questions
    const defaultQuestions = [
      "Check my transaction status",
      "Update my account details",
      "Speak to a support agent"
    ];

    const CustomerChat = () => {
      const [messages, setMessages] = useState([
        {
          content: "Welcome! How can we help you today?",
          isCustomer: false,
          timestamp: new Date().toISOString(),
          options: defaultQuestions // show default questions on init
        }
      ]);
      const [inputMessage, setInputMessage] = useState('');
      const [connectionStatus, setConnectionStatus] = useState('connecting');
      const [ws, setWs] = useState(null);
      const [customerId, setCustomerId] = useState('');
      const [branchCode, setBranchCode] = useState('');
      const [userInfo, setUserInfo] = useState(null);
      const messagesEndRef = useRef(null);

      // Extract URL params
      useEffect(() => {
        const urlCustomerId = getUrlParameter('cust_id');
        const urlBranchCode = getUrlParameter('branch_code');
        const urlCustName = getUrlParameter('cust_name');

        setCustomerId(urlCustomerId);
        setBranchCode(urlBranchCode);
        setUserInfo({
          customerId: urlCustomerId,
          branchCode: urlBranchCode,
          custName: urlCustName
        });

        console.log('URL Parameters:', { urlCustomerId, urlBranchCode });
        loadPreviousMessages(urlCustomerId, urlBranchCode);
      }, []);

      // Load previous messages
      const loadPreviousMessages = async (custId, brCode) => {
        try {
          const response = await fetch(`./LoadPreviousMesgs?cust_id=${custId}&branch_code=${brCode}&req_from=customer`);
          if (!response.ok) throw new Error('Failed to fetch previous messages');
          let data = await response.json();

          let filtered = data.filter(msg => msg.custID1 === custId);
          filtered.sort((a, b) => new Date(a.date) - new Date(b.date));

          const formattedMessages = filtered.map(msg => ({
            content: msg.message,
            isCustomer: msg.sender.toLowerCase() === 'customer',
            timestamp: msg.date
          }));

          setMessages(prev => [
            ...prev,
            ...formattedMessages
          ]);
        } catch (error) {
          console.error('Error loading previous messages:', error);
        }
      };

      // WebSocket connection
      useEffect(() => {
        if (!customerId || !branchCode) return;

        const connectWebSocket = () => {
          try {
            const websocket = new WebSocket(`wss://ce.uat.web:7002/ChatBox/chatServer`);
            websocket.onopen = () => {
              console.log('Connected');
              setConnectionStatus('connected');
              websocket.send(JSON.stringify({
                type: 'register',
                role: 'customer',
                customerId,
                branchCode,
                customerName: userInfo?.custName || ''
              }));
            };
            websocket.onmessage = (event) => {
              const message = JSON.parse(event.data);
              handleIncomingMessage(message);
            };
            websocket.onclose = () => {
              setConnectionStatus('disconnected');
              setTimeout(connectWebSocket, 3000);
            };
            websocket.onerror = (error) => {
              console.error('WebSocket error:', error);
              setConnectionStatus('error');
            };
            setWs(websocket);
          } catch (error) {
            console.error('WebSocket init failed:', error);
            setConnectionStatus('error');
          }
        };
        connectWebSocket();
        return () => { if (ws) ws.close(); };
      }, [customerId, branchCode]);

      // Handle messages
      const handleIncomingMessage = (message) => {
        if (message.customerId !== customerId) return;
        if (message.type === 'message') {
          const newMessage = {
            content: message.content,
            isCustomer: message.sender === 'customer',
            timestamp: message.timestamp || new Date().toISOString()
          };
          setMessages(prev => [...prev, newMessage]);
        }
      };

      // Send message
      const sendMessage = (msgText = inputMessage.trim()) => {
        if (!msgText || !ws || ws.readyState !== WebSocket.OPEN) return;
        const messageData = {
          type: 'message',
          content: msgText,
          customerId,
          branchCode,
          sender: 'customer',
          timestamp: new Date().toISOString(),
          customerName: userInfo?.custName || ''
        };
        ws.send(JSON.stringify(messageData));
        setMessages(prev => [...prev, {
          content: msgText,
          isCustomer: true,
          timestamp: messageData.timestamp
        }]);
        setInputMessage('');
      };

      // Handle Enter key
      const handleKeyPress = (e) => { if (e.key === 'Enter') sendMessage(); };

      // Scroll to bottom
      const scrollToBottom = () => { messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' }); };
      useEffect(() => { scrollToBottom(); }, [messages]);

      // Handle option click
      const handleOptionClick = (option) => {
        sendMessage(option); // treat as customer input
        // Optionally push a bank response immediately
        if (option === "Check my transaction status") {
          setMessages(prev => [...prev, {
            content: "Please provide your transaction number.",
            isCustomer: false,
            timestamp: new Date().toISOString()
          }]);
        } else if (option === "Update my account details") {
          setMessages(prev => [...prev, {
            content: "Sure, what detail would you like to update?",
            isCustomer: false,
            timestamp: new Date().toISOString()
          }]);
        } else if (option === "Speak to a support agent") {
          setMessages(prev => [...prev, {
            content: "Connecting you to a support agent...",
            isCustomer: false,
            timestamp: new Date().toISOString()
          }]);
        }
      };

      return (
        <div className="chat-container">
          <div className="chat-header">
            <h2>Customer Support Chat</h2>
            {userInfo && (
              <div className="user-info">
                Customer: {userInfo.custName} | Branch: SBIN00{userInfo.branchCode}
              </div>
            )}
            <div className={`connection-status status-${connectionStatus}`}>
              {connectionStatus === 'connected' && 'Connected'}
              {connectionStatus === 'disconnected' && 'Reconnecting...'}
              {connectionStatus === 'connecting' && 'Connecting...'}
              {connectionStatus === 'error' && 'Connection Error'}
            </div>
          </div>

          <div className="chat-messages">
            {messages.map((message, index) => (
              <div key={index} className={`message ${message.isCustomer ? 'customer' : 'bank'}`}>
                <div className="message-content">
                  {message.content}
                  {message.options && (
                    <div className="options">
                      {message.options.map((opt, i) => (
                        <button key={i} className="option-btn" onClick={() => handleOptionClick(opt)}>
                          {opt}
                        </button>
                      ))}
                    </div>
                  )}
                </div>
                <div className="message-time">
                  {new Date(message.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                </div>
              </div>
            ))}
            <div ref={messagesEndRef} />
          </div>

          <div className="chat-input">
            <div className="input-container">
              <input
                type="text"
                className="message-input"
                value={inputMessage}
                onChange={(e) => setInputMessage(e.target.value)}
                onKeyPress={handleKeyPress}
                placeholder="Type your message..."
                maxLength="500"
                disabled={connectionStatus !== 'connected'}
              />
              <button className="send-button" onClick={() => sendMessage()} disabled={!inputMessage.trim() || connectionStatus !== 'connected'}>
                Send
              </button>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CustomerChat />);
  </script>

  <style>
    /* Quick inline styling for options */
    .options {
      margin-top: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .option-btn {
      background: #0056b3;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .option-btn:hover {
      background: #00408d;
    }
  </style>
</body>
</html>
