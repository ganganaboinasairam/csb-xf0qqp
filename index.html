CREATE OR REPLACE FUNCTION get_msg_cont (v_msg_type VARCHAR2) 
RETURN clob_table 
PIPELINED 
AS
BEGIN
    FOR rec IN (
        SELECT c_msg_content
        FROM stp_in_msg_sto
        WHERE c_msg_content LIKE '%' || v_msg_type || '%'
    )
    LOOP
        PIPE ROW (rec.c_msg_content);
    END LOOP;

    RETURN;
END;
/
