<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML Table Normalizer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    textarea {
      width: 100%;
      height: 300px;
      font-family: monospace;
      font-size: 14px;
    }
    #output {
      margin-top: 20px;
      padding: 10px;
      background: #f0f0f0;
      white-space: pre-wrap;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h2>HTML Table Normalizer</h2>
  <p>Paste your HTML code below and click "Convert" to normalize table rows.</p>

  <textarea id="inputHtml" placeholder="Paste your HTML here..."></textarea>
  <br>
  <button onclick="convertHtml()">Convert</button>

  <h3>Normalized Output:</h3>
  <div id="output"></div>

  <script>
    function normalizeTableRows(htmlString) {
      const wrapper = document.createElement('div');
      wrapper.innerHTML = htmlString;

      const rows = wrapper.querySelectorAll('table tbody tr');
      const newRows = [];

      rows.forEach((row) => {
        const cells = Array.from(row.children);
        if (cells.length <= 2) {
          newRows.push(row.cloneNode(true));
        } else {
          for (let i = 0; i < cells.length; i += 2) {
            const newRow = document.createElement('tr');
            const labelTd = cells[i].cloneNode(true);
            const valueTd = cells[i + 1] ? cells[i + 1].cloneNode(true) : document.createElement('td');
            newRow.appendChild(labelTd);
            newRow.appendChild(valueTd);
            newRows.push(newRow);
          }
        }
      });

      const tbody = wrapper.querySelector('table tbody');
      if (tbody) {
        tbody.innerHTML = '';
        newRows.forEach((row) => tbody.appendChild(row));
      }

      return wrapper.innerHTML;
    }

    function convertHtml() {
      const inputHtml = document.getElementById('inputHtml').value;
      const output = normalizeTableRows(inputHtml);
      document.getElementById('output').textContent = output;
    }
  </script>

</body>
</html>
