<!DOCTYPE html>
<html>
<head>
<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.topbar{
    background:#222;
    padding:10px;
}

button{
    padding:10px;
    margin-right:5px;
    cursor:pointer;
}

.container{
    flex:1;
    position:relative;
}

.tool-frame{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    border:none;
    display:none;
}

.tool-frame.active{
    display:block;
}

</style>
</head>

<body>

<div class="topbar">
    <button onclick="showTab('tool1')">Tool 1</button>
    <button onclick="showTab('tool2')">Tool 2</button>
    <button onclick="showTab('tool3')">Tool 3</button>
</div>

<div class="container">

    <iframe
        id="tool1"
        class="tool-frame active"
        src="tools/tool1.html">
    </iframe>

    <iframe
        id="tool2"
        class="tool-frame"
        src="tools/tool2.html">
    </iframe>

    <iframe
        id="tool3"
        class="tool-frame"
        src="tools/tool3.html">
    </iframe>

</div>

<script>

function showTab(id){

    document
        .querySelectorAll('.tool-frame')
        .forEach(frame => {
            frame.classList.remove('active');
        });

    document
        .getElementById(id)
        .classList.add('active');
}

</script>

</body>
</html>
