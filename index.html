DECLARE
    v_msg_type VARCHAR2 := 'INLC_INLC_IssueLC_EE2CE';
    v_msg_cont CLOB;
BEGIN
    SELECT
        c_msg_content
    INTO v_msg_cont
    FROM
        stp_in_msg_sto
    WHERE
            c_main_ref = '0999517LC0000722'
        AND c_msg_content LIKE '%'
                               || v_msg_type
                               || '%';

    dbms_output.put_line(v_msg_cont);
END;
/
