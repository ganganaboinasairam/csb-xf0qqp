<!DOCTYPE html>
<html>
<head>
</head>
<body>
        <div class="container">

                <div class="topBar">
                        <h2>Jar Updater</h2>
                        <div>
                                <button onclick="openAddProjectPopup()" style="margin-right: 5px;">+ Add Project</button>
                                <button onclick="openProjectListPopup()" style="margin-right: 5px;">View / Edit Projects</button>
                                <button onclick="loadProjects();" style="margin-right: 5px;">Refresh</button>
                                <button class="danger" onclick="deleteProject()">Delete Project</button>
                        </div>
                </div>

                <label><b>Project</b></label> <select id="project"></select> <input
                        id="search" type="text" placeholder="Search class...">

                <div id="classes"></div>

                <div class="actions">
                        <button onclick="updateJar()">Backup & Update JAR</button>
                </div>

                <div id="msg"></div>

        </div>

        <!-- Add / Edit project modal (reused for both) -->
        <div id="projectModal" class="modal">
                <div class="modal-content">

                        <span class="close" onclick="closeProjectPopup()">&times;</span>
                        <h3 id="modalTitle">Add New Project</h3>
                        <input id="pid" placeholder="Project ID">
                        <input id="pname" placeholder="Project Name">
                        <input id="pworkspace" placeholder="Bin Folder">
                        <input id="psrc" placeholder="Source Folder">
                        <input id="pjar" placeholder="JAR Path">
                        <div class="modal-buttons">
                                <button class="secondary" onclick="closeProjectPopup()">Cancel</button>
                                <button onclick="saveProject()">Save Project</button>
                        </div>

                </div>
        </div>

        <!-- View / Edit projects list modal -->
        <div id="projectListModal" class="modal">
                <div class="modal-content">
                        <span class="close" onclick="closeProjectListPopup()">&times;</span>
                        <h3>Projects</h3>
                        <table id="projectTable" style="width:100%;border-collapse:collapse;">
                                <thead>
                                        <tr>
                                                <th style="text-align:left;">ID</th>
                                                <th style="text-align:left;">Name</th>
                                                <th style="text-align:left;">Bin Folder</th>
                                                <th style="text-align:left;">Source Folder</th>
                                                <th style="text-align:left;">JAR Path</th>
                                                <th></th>
                                        </tr>
                                </thead>
                                <tbody id="projectTableBody"></tbody>
                        </table>
                </div>
        </div>

        <script>
let all=[];
// id of the project currently being edited, or null when adding a new one
let editingProjectId = null;

// Always re-fetches the project list from the server (no client-side caching).
// Optionally keeps a particular project selected after the refresh.
function populateProjects(keepSelectedId){
        fetch('../api/projects').then(r=>r.json()).then(d=>{
                let p=document.getElementById('project');
                p.innerHTML='';
                d.forEach(x=>p.add(new Option(x.name,x.id)));
                if(keepSelectedId && d.some(x=>x.id===keepSelectedId)){
                        p.value = keepSelectedId;
                }
                load();
        });
}

populateProjects();

function loadProjects(){
        populateProjects(project.value);
}

function load(){
        if(!project.value){
                all=[];
                fill(all);
                return;
        }
        fetch('../api/classes?projectId='+project.value).then(r=>r.json()).then(d=>{all=d;fill(d);});
}
function deleteProject(){
if(!project.value){
        alert('Select a Project');
        return;
}

if(!confirm("Deleted the selected project ?")){
        return;
}
fetch("../api/jarup/delete",{
        method:"POST",
        headers:{
                "Content-Type":"application/json"
        },
        body:JSON.stringify({
                projectId:project.value
        })
})
.then(r=>r.text())
.then(t=>{
        alert(t);
        loadProjects();
})
}

function openAddProjectPopup(){
        editingProjectId = null;
        document.getElementById("modalTitle").innerText = "Add New Project";
        pid.value=''; pid.disabled=false;
        pname.value=''; pworkspace.value=''; psrc.value=''; pjar.value='';
        document.getElementById("projectModal").style.display="block";
}

function openProjectPopup(){
        // kept for backwards compatibility, behaves like "add"
        openAddProjectPopup();
}

function closeProjectPopup(){
        document.getElementById("projectModal").style.display="none";
        editingProjectId = null;
        pid.disabled = false;
}

function saveProject(){
        if(!pid.value || !pname.value || !pworkspace.value || !pjar.value){
                alert("Project ID, Name, Bin Folder and JAR Path are required");
                return;
        }

        let payload = {
                id:pid.value,
                name:pname.value,
                workspace:pworkspace.value,
                srcPath:psrc.value,
                jarPath:pjar.value
        };

        let url = editingProjectId ? "../api/updateProject" : "../api/addProject";

        fetch(url,{
                method:"POST",
                headers:{
                        "Content-type":"application/json"
                },
                body:JSON.stringify(payload)

        }).then(r=>r.text())
                .then(
                        t=>{
                                alert(t);
                                let savedId = payload.id;
                                closeProjectPopup();
                                populateProjects(savedId);
                        }
                )
}

function openProjectListPopup(){
        // always re-fetch from the server, never reuse a cached list
        fetch('../api/projects').then(r=>r.json()).then(d=>{
                let tbody = document.getElementById('projectTableBody');
                tbody.innerHTML = '';
                d.forEach(p=>{
                        let tr = document.createElement('tr');

                        let idTd = document.createElement('td');
                        idTd.textContent = p.id;
                        let nameTd = document.createElement('td');
                        nameTd.textContent = p.name;
                        let wsTd = document.createElement('td');
                        wsTd.textContent = p.workspace || '';
                        let srcTd = document.createElement('td');
                        srcTd.textContent = p.srcPath || '';
                        let jarTd = document.createElement('td');
                        jarTd.textContent = p.jarPath || '';
                        let actionTd = document.createElement('td');
                        let editBtn = document.createElement('button');
                        editBtn.textContent = 'Edit';
                        editBtn.onclick = () => editProject(p);
                        actionTd.appendChild(editBtn);

                        tr.appendChild(idTd);
                        tr.appendChild(nameTd);
                        tr.appendChild(wsTd);
                        tr.appendChild(srcTd);
                        tr.appendChild(jarTd);
                        tr.appendChild(actionTd);
                        tbody.appendChild(tr);
                });
                document.getElementById("projectListModal").style.display="block";
        });
}

function closeProjectListPopup(){
        document.getElementById("projectListModal").style.display="none";
}

function editProject(p){
        editingProjectId = p.id;
        document.getElementById("modalTitle").innerText = "Edit Project";
        pid.value = p.id;
        pid.disabled = true; // project id is the key, don't allow changing it while editing
        pname.value = p.name || '';
        pworkspace.value = p.workspace || '';
        psrc.value = p.srcPath || '';
        pjar.value = p.jarPath || '';
        closeProjectListPopup();
        document.getElementById("projectModal").style.display="block";
}

function fill(a){
        classes.innerHTML='';
        a.forEach(x=>{
                let div = document.createElement("div");
                div.innerHTML = "<label>" + "<input type='checkbox' value='"+x+"'>"+x+"</label>";
                classes.appendChild(div);
        });
        }

        function getSelectedClasses(){
                let arr = [];
                document.querySelectorAll("#classes input[type=checkbox]:checked").forEach(c=>arr.push(c.value));
                return arr;
        }

project.onchange=load;
search.onkeyup=()=>fill(all.filter(x=>x.toLowerCase().includes(search.value.toLowerCase())));

function updateJar(){

        let selected = getSelectedClasses();

        if(selected.length == 0){
                alert("select at least one class");
                return;
        }


 fetch('../api/updateJar',{
        method:'POST',
        headers:{
                'Content-Type':'application/json'
        },
 body:JSON.stringify({
        projectId:project.value,
        classFiles:selected
 })
})
 .then(r=>r.text())
 .then(t=>{processResponse(t)});
}

function processResponse(t){
        if(t.includes('File Not Found')){
                msg.innerHTML = t
        }else if (t == 'SUCCESS'){
                msg.innerHTML = 'All .class files and .java Source files are moved successfully';
        }else if (t == 'PARTIAL_SUCCESS'){
                msg.innerHTML = 'All .class files are moved successfully';
        }
}
</script>
</body>
</html>
