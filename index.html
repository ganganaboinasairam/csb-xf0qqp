const flowArray = message.flow
  .replace(/^\[|\]$/g, '') // remove square brackets
  .split(',')               // split by commas
  .map(item => item.trim()); // trim extra spaces

const flowOptions = flowArray.map((option, index) => (
  <button key={index} className="question-btn" onClick={() => sendMessage(option)}>
    {option}
  </button>
));
