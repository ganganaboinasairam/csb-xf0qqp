/* ====== RENDER TABLE ====== */
function renderRunningOrders() {
    const table = document.querySelectorAll(".cata-tab")[0];
    const tbody = table.querySelector("tbody");
    tbody.innerHTML = "";

    const start = (currentPage - 1) * rowsPerPage;
    const end = start + rowsPerPage;
    const pageData = runningOrdersData.slice(start, end);

    pageData.forEach(order => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${order.spotOrderNo}</td>
            <td>${order.currency1}/${order.currency2}</td>
            <td>${order.orderType}</td>
            <td>${order.buySell}</td>
            <td>${order.amount}</td>
            <td>${order.limitRate}</td>
            <td>${order.dueDate}</td>
            <td>${order.StopLossRate}</td>
            <td>${order.orderStatus}</td>
            <td></td>
        `;

        tbody.appendChild(tr);
    });
}

/* ====== PAGINATION ====== */
function renderPagination() {
    let paginationDiv = document.getElementById("runningOrderPagination");

    if (!paginationDiv) {
        paginationDiv = document.createElement("div");
        paginationDiv.id = "runningOrderPagination";
        paginationDiv.style.textAlign = "center";
        paginationDiv.style.marginTop = "10px";

        const table = document.querySelectorAll(".cata-tab")[0];
        table.parentElement.appendChild(paginationDiv);
    }

    paginationDiv.innerHTML = "";

    const totalPages = Math.ceil(runningOrdersData.length / rowsPerPage);

    for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement("button");
        btn.innerText = i;
        btn.style.margin = "0 5px";
        btn.style.cursor = "pointer";

        if (i === currentPage) {
            btn.disabled = true;
        }

        btn.onclick = function () {
            currentPage = i;
            renderRunningOrders();
            renderPagination();
        };

        paginationDiv.appendChild(btn);
    }
}
