<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Customer Support Dashboard</title>
    <link rel="stylesheet" href="bankStyles.css">

    <!-- React and Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Utility function to get URL parameters
        const getUrlParameter = (name) => {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            const results = regex.exec(window.location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        };

        

        // Bank Dashboard Component with WebSocket
        const BankDashboard = () => {
            const [customers, setCustomers] = useState([]);
            const [selectedCustomer, setSelectedCustomer] = useState(null);
            const [inputMessage, setInputMessage] = useState('');
            const [connectionStatus, setConnectionStatus] = useState('connecting');
            const [ws, setWs] = useState(null);
            const messagesEndRef = useRef(null);

            // WebSocket connection
            useEffect(() => {
                const connectWebSocket = () => {
                    try {
                        //const websocket = new WebSocket(`ws://localhost:8080/ChatboxEECE/chatServer`);
                        const websocket = new WebSocket(`ws://10.177.141.86:7001/ChatboxEECE/chatServer`);

                        
                       


                        websocket.onopen = () => {
                            console.log('Bank WebSocket connected');
                            setConnectionStatus('connected');
 
                            // Send initial connection message
                            websocket.send(JSON.stringify({
                                type: 'register',
                                role: 'bank'
                            }));

                            // Call loadPreviousMessages when page loads
                            loadPreviousMessages();
                        };



                        websocket.onmessage = (event) => {
                            const message = JSON.parse(event.data);
                            handleIncomingMessage(message);
                        };

                        websocket.onclose = () => {
                            console.log('Bank WebSocket disconnected');
                            setConnectionStatus('disconnected');
                            setTimeout(connectWebSocket, 3000);
                        };

                        websocket.onerror = (error) => {
                            console.error('Bank WebSocket error:', error);
                            setConnectionStatus('error');
                        };

                        setWs(websocket);
                    } catch (error) {
                        console.error('Failed to create bank WebSocket:', error);
                        setConnectionStatus('error');
                    }
                };

                connectWebSocket();

                return () => {
                    if (ws) ws.close();
                };
            }, []);

           

            const loadPreviousMessages = async () => {
                try {
                    const branchCode = getUrlParameter('branch_code');

                    const response = await fetch(`./LoadPreviousMesgs?req_from=bank&branch_code=${branchCode}`);
                    if (!response.ok) throw new Error('Failed to fetch previous messages');

                    let data = await response.json();

                    // Group messages by custID1
                    const customerMap = {};

                    data.forEach(msg => {
                        const custId = msg.custID1;
                        const custName = msg.custName;
                        if (!customerMap[custId]) {
                            customerMap[custId] = {
                                id: custId,
                                name: custName, // Change if name is available
                                lastMessage: '',
                                lastMessageTime: '',
                                status: "online",
                                unreadCount: 0,
                                messages: []
                            };
                        }

                        customerMap[custId].messages.push({
                            content: msg.message,
                            type: msg.type,
                            isCustomer: msg.sender.toLowerCase() === 'customer',
                            timestamp: msg.date
                        });
                    });

                    // Sort messages inside each customer
                    Object.values(customerMap).forEach(customer => {
                        customer.messages.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

                        // Set last message details
                        const lastMsg = customer.messages[customer.messages.length - 1];
                        customer.lastMessage = lastMsg.content;
                        customer.lastMessageTime = new Date(lastMsg.timestamp).toLocaleTimeString([], {
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                    });

                    // Convert to array and sort by last message time (desc)
                    const customerList = Object.values(customerMap).sort((a, b) => {
                        const timeA = new Date(a.messages[a.messages.length - 1].timestamp);
                        const timeB = new Date(b.messages[b.messages.length - 1].timestamp);
                        return timeB - timeA;
                    });

                    // Update state
                    setCustomers(customerList);

                    // Optionally select the most recent customer automatically
                    if (customerList.length > 0) {
                        setSelectedCustomer(customerList[0]);
                    }

                } catch (error) {
                    console.error('Error loading previous messages:', error);
                }
            };

            const handleIncomingMessage = (message) => {
                if (message.type === 'message' || message.type === 'cust-alert') {
                    const customerId = message.customerId;
                    const customerName = message.customerName || `Customer ${customerId}`;
                    //const customerEmail = message.customerEmail || `${customerId}@customer.com`;

                    setCustomers(prevCustomers => {
                        const existingCustomerIndex = prevCustomers.findIndex(c => c.id === customerId);

                        if (existingCustomerIndex !== -1) {
                            // Update existing customer
                            const updatedCustomers = [...prevCustomers];
                            const customer = updatedCustomers[existingCustomerIndex];

                            customer.messages = [...customer.messages, {
                                content: message.content,
                                isCustomer: true,
                                type:message.type,
                                timestamp: message.timestamp || new Date().toISOString()
                            }];
                            customer.lastMessage = message.content;
                            customer.lastMessageTime = "Just now";

                            // Move customer to top
                            updatedCustomers.splice(existingCustomerIndex, 1);
                            updatedCustomers.unshift(customer);

                            return updatedCustomers;
                        } else {
                            // Add new customer
                            const newCustomer = {
                                id: customerId,
                                name: customerName,
                                //email: customerEmail,
                                lastMessage: message.content,
                                lastMessageTime: "Just now",
                                status: "online",
                                unreadCount: selectedCustomer?.id === customerId ? 0 : 1,
                                messages: [{
                                    content: message.content,
                                    isCustomer: true,
                                    type:message.type,
                                    timestamp: message.timestamp || new Date().toISOString()
                                }]
                            };

                            return [newCustomer, ...prevCustomers];
                        }
                    });

                    // Update selected customer if currently viewing
                    if (selectedCustomer && message.customerId === selectedCustomer.id) {
                        setSelectedCustomer(prev => {
                            if (!prev) return null;
                            return {
                                ...prev,
                                messages: [...prev.messages, {
                                    content: message.content,
                                    isCustomer: true,
                                    type:message.type,
                                    timestamp: message.timestamp || new Date().toISOString()
                                }],
                                lastMessage: message.content,
                                lastMessageTime: "Just now"
                            };
                        });
                    }
                }else if (message.type == 'cust-alert'){
                    console.log("message is "+message.content)
                    const customerId = message.customerId;
                    const customerName = message.customerName || `Customer ${customerId}`;
                }
            };

            const handleCustomerSelect = (customer) => {
                setSelectedCustomer(customer);

                // Mark messages as read
                setCustomers(prevCustomers =>
                    prevCustomers.map(c =>
                        c.id === customer.id ? { ...c, unreadCount: 0 } : c
                    )
                );
            };

            const sendMessage = () => {
                if (!inputMessage.trim() || !selectedCustomer || !ws || ws.readyState !== WebSocket.OPEN) return;

                 const branchCode = getUrlParameter('branch_code');

                const messageData = {
                    type: 'message',
                    content: inputMessage.trim(),
                    customerId: selectedCustomer.id,
                    sender: 'bank',
                    timestamp: new Date().toISOString(),
                    customerName: selectedCustomer.name,
                    branchCode: branchCode
                };

                ws.send(JSON.stringify(messageData));

                // Add message to local state
                const newMessage = {
                    content: inputMessage.trim(),
                    isCustomer: false,
                    timestamp: messageData.timestamp
                };

                setSelectedCustomer(prev => {
                    if (!prev) return null;
                    return {
                        ...prev,
                        messages: [...prev.messages, newMessage],
                        lastMessage: inputMessage.trim(),
                        lastMessageTime: "Just now"
                    };
                });

                // Update customers list
                setCustomers(prevCustomers =>
                    prevCustomers.map(c =>
                        c.id === selectedCustomer.id
                            ? { ...c, messages: [...c.messages, newMessage], lastMessage: inputMessage.trim(), lastMessageTime: "Just now" }
                            : c
                    )
                );

                setInputMessage('');
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            };

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            };

            useEffect(() => {
                scrollToBottom();
            }, [selectedCustomer?.messages]);

            return (
                <div className="bank-container">
                    <div className="customer-list">
                        <div className="customer-list-header">
                            Bank Customer Support Dashboard
                            <div style={{ fontSize: '0.8em', marginTop: '5px' }}>
                                {customers.filter(c => c.status === 'online').length} Customers
                            </div>
                        </div>
                        {customers.map(customer => (
                            <div
                                key={customer.id}
                                className={`customer-item ${selectedCustomer?.id === customer.id ? 'active' : ''}`}
                                onClick={() => handleCustomerSelect(customer)}
                            >
                                <div className="customer-name">
                                    <span className={`customer-status status-${customer.status}`}></span>
                                    {customer.name}
                                </div>
                                <div className="customer-preview">
                                    {customer.lastMessage}
                                </div>
                                {customer.unreadCount > 0 && (
                                    <span style={{
                                        backgroundColor: '#dc3545',
                                        color: 'white',
                                        borderRadius: '50%',
                                        padding: '2px 6px',
                                        fontSize: '0.8em',
                                        float: 'right'
                                    }}>
                                        {customer.unreadCount}
                                    </span>
                                )}
                            </div>
                        ))}
                    </div>

                    <div className="chat-area">
                        {selectedCustomer ? (
                            <>
                                <div className="chat-header">
                                    <h2>{selectedCustomer.name}</h2>
                                    <div style={{ fontSize: '0.9em', color: '#f8f9fa' }}>
                                        {selectedCustomer.email}
                                    </div>
                                </div>

                                <div className="chat-messages">
                                    {selectedCustomer.messages.map((message, index) => (
                                        <div key={index} className={`message ${message.isCustomer ? 'customer' : 'bank'}`}>
                                            <div className={message.type === 'cust-alert' ? "cust-alert-band":"message-content"}>
                                                {message.content}
                                                {message.type === 'cust-alert' && (
                                                    <span>{new Date(message.timestamp).toLocaleString("en-GB")}</span>
                                                )}
                                            </div>
                                            {!message.type === 'cust-alert' && (
                                            <div className="message-time">
                                                {new Date(message.timestamp).toLocaleString("en-GB")}
                                            </div>
                                        )}
                                        </div>
                                    ))}
                                    <div ref={messagesEndRef} />
                                </div>

                                <div className="chat-input">
                                    <div className="input-container">
                                        <input
                                            type="text"
                                            className="message-input"
                                            value={inputMessage}
                                            onChange={(e) => setInputMessage(e.target.value)}
                                            onKeyPress={handleKeyPress}
                                            placeholder="Type your response..."
                                            maxLength="500"
                                            disabled={connectionStatus !== 'connected'}
                                        />
                                        <button
                                            className="send-button"
                                            onClick={sendMessage}
                                            disabled={!inputMessage.trim() || connectionStatus !== 'connected'}
                                        >
                                            Send
                                        </button>
                                    </div>
                                </div>
                            </>
                        ) : (
                            <div className="no-customer-selected">
                                Select a customer to start chatting
                            </div>
                        )}
                    </div>

                    <div className={`connection-status status-${connectionStatus}`}>
                        {connectionStatus === 'connected' ? 'Connected' :
                            connectionStatus === 'connecting' ? 'Connecting...' : 'Disconnected'}
                    </div>
                </div>
            );
        };

        // Render the bank dashboard
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BankDashboard />);
    </script>
</body>

</html>
