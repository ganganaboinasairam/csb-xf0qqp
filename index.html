<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  // Utility: get URL param
  const getUrlParameter = (name) => {
    name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
    const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
    const results = regex.exec(window.location.search);
    return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
  };

  // Timestamp parser: "DD-MON-YY HH.mm.ss.SSSSSS AM/PM ±HH:MM" -> Date
  function parseBankTimestamp(ts) {
    const re = /^(\d{2})-([A-Z]{3})-(\d{2})\s+(\d{1,2})\.(\d{2})\.(\d{2})\.(\d{3,6})\s+(AM|PM)\s+([+-]\d{2}:\d{2})$/i;
    const m = ts.match(re);
    if (!m) return new Date(NaN);

    const [, dd, monStr, yy, h12, mm, ss, frac, ampm, tz] = m;
    const months = { JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11 };
    const month = months[monStr.toUpperCase()];
    const year = 2000 + parseInt(yy, 10);

    let hour = parseInt(h12, 10) % 12;
    if (ampm.toUpperCase() === 'PM') hour += 12;

    const minute = parseInt(mm, 10);
    const second = parseInt(ss, 10);
    const ms = Math.floor(parseInt(frac.padEnd(6, '0').slice(0, 6), 10) / 1000);

    const [sign, th, tm] = [tz[0], tz.slice(1, 3), tz.slice(4, 6)];
    const offsetMinutes = (parseInt(th, 10) * 60 + parseInt(tm, 10)) * (sign === '-' ? -1 : 1);

    const utcMs = Date.UTC(year, month, parseInt(dd, 10), hour, minute, second, ms) - offsetMinutes * 60_000;
    return new Date(utcMs);
  }

  const formatDate = (dateStr) => {
    let normalized = dateStr.replace(/(\d+)\.(\d+)\.(\d+)/, "$1:$2:$3");
    normalized = normalized.replace(/\.\d+/, "");
    const date = new Date(normalized);
    if (isNaN(date)) return dateStr;

    const pad = (n) => String(n).padStart(2, "0");
    return `${pad(date.getDate())}/${pad(date.getMonth()+1)}/${date.getFullYear()}, ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
  };

  // NEW: truncate by words
  const truncateWords = (text = "", maxWords = 20) => {
    const words = String(text).trim().split(/\s+/);
    if (words.length <= maxWords) return text;
    return words.slice(0, maxWords).join(" ") + " ...";
  };

  const branchCode = getUrlParameter('branch_code');
  const tellerId = getUrlParameter('teller_id');

  const BankDashboard = () => {
    const [customers, setCustomers] = useState([]);
    const [selectedCustomer, setSelectedCustomer] = useState(null);
    const [inputMessage, setInputMessage] = useState('');
    const [connectionStatus, setConnectionStatus] = useState('connecting');
    const messagesEndRef = useRef(null);
    const [showModal, setShowModal] = useState(false);
    const [newQuestion, setNewQuestion] = useState('');
    const [newAnswer, setNewAnswer] = useState('');
    const [lastTimestamp, setLastTimestamp] = useState(null);

    useEffect(() => {
      loadPreviousMessages();
    }, []);

    // WebSocket init (unchanged except comments)
    useEffect(() => {
      const fetchJwtTokenAndInit = async () => {
        if (!tellerId || !branchCode) {
          console.error('Missing tellerId or branchCode');
          setConnectionStatus('error');
          return;
        }
        try {
          if (!window.bankWebSocket || typeof window.bankWebSocket.init !== 'function') {
            console.error('window.bankWebSocket.init not found. Ensure BANK_webSocketConn.jsx is loaded.');
            setConnectionStatus('error');
            return;
          }
          window.bankWebSocket.init({
            urlBase: 'ws://10.177.141.86:7001',
            token: "",
            tellerId,
            branchCode,
            onOpen: () => setConnectionStatus('connected'),
            onClose: () => setConnectionStatus('disconnected'),
            onError: (err) => { console.error('Bank WebSocket error:', err); setConnectionStatus('error'); },
            // onMessage: (msg) => handleIncomingMessage(msg) // keep if you wire server push
          });
        } catch (error) {
          console.error('Error initializing WebSocket:', error);
          setConnectionStatus('error');
        }
      };
      fetchJwtTokenAndInit();
      return () => {
        if (window.bankWebSocket && typeof window.bankWebSocket.close === 'function') {
          window.bankWebSocket.close();
        }
      };
    }, []);

    // --- NEW: unread count helpers ---
    const getUnreadCount = async (custId) => {
      try {
        const url = `http://10.177.141.86:7001/ChatServer/getUnreadMsgCount?branchCode=${encodeURIComponent(branchCode)}&custId=${encodeURIComponent(custId)}`;
        const resp = await fetch(url);
        if (!resp.ok) throw new Error('Unread count fetch failed');
        const data = await resp.json();
        // Expecting either {count:n} or a plain number; normalize:
        const count = typeof data === 'number' ? data : (Number(data.count) || 0);
        return Math.max(0, count);
      } catch (e) {
        console.error('getUnreadCount error for', custId, e);
        return 0; // safe fallback
      }
    };

    const refreshUnreadCountsForAll = async (customerArray) => {
      const results = await Promise.all(
        customerArray.map(async (c) => {
          const count = await getUnreadCount(c.id);
          return { id: c.id, count };
        })
      );
      setCustomers(prev => prev.map(c => {
        const hit = results.find(r => r.id === c.id);
        return hit ? { ...c, unreadCount: (selectedCustomer?.id === c.id ? 0 : hit.count) } : c;
      }));
    };
    // --- end helpers ---

    const loadPreviousMessages = async () => {
      try {
        const response = await fetch(`http://10.177.141.86:7001/ChatServer/loadPreviousMessages?custId=${tellerId}&reqFrom=bank&branchCode=${branchCode}`);
        if (!response.ok) throw new Error('Failed to fetch previous messages');

        let data = await response.json();

        // Group by customer
        const customerMap = {};
        data.forEach(msg => {
          const custId = msg.custID1;
          const custName = msg.custName;
          if (!customerMap[custId]) {
            customerMap[custId] = {
              id: custId,
              name: custName,
              lastMessage: '',
              lastMessageTime: '',
              status: "online",
              unreadCount: 0,
              messages: []
            };
          }
          customerMap[custId].messages.push({
            content: msg.message,
            type: msg.type,
            isCustomer: msg.sender.toLowerCase() === 'customer',
            timestamp: parseBankTimestamp(msg.date).toISOString()
          });
        });

        Object.values(customerMap).forEach(customer => {
          customer.messages.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
          const lastMsg = customer.messages[customer.messages.length - 1];
          customer.lastMessage = lastMsg?.content ?? '';
          customer.lastMessageTime = lastMsg ? formatDate(lastMsg.timestamp) : '';
        });

        const customerList = Object.values(customerMap).sort((a, b) => {
          const timeA = new Date(a.messages[a.messages.length - 1]?.timestamp || 0);
          const timeB = new Date(b.messages[b.messages.length - 1]?.timestamp || 0);
          return timeB - timeA;
        });

        setCustomers(customerList);

        const allTimestamps = customerList.flatMap(c => c.messages.map(m => m.timestamp));
        const latestTimestamp = allTimestamps.length > 0 ? allTimestamps.sort().pop() : null;
        setLastTimestamp(latestTimestamp);

        if (customerList.length > 0) setSelectedCustomer(customerList[0]);

        // NEW: fetch unread counts for all (authoritative)
        refreshUnreadCountsForAll(customerList);

      } catch (error) {
        console.error('Error loading previous messages:', error);
      }
    };

    const fetchNewMessages = async () => {
      if (!lastTimestamp) return;
      try {
        const response = await fetch(`http://10.177.141.86:7001/ChatServer/loadPreviousMessages?custId=${tellerId}&reqFrom=bank&branchCode=${branchCode}&lastTimestamp=${encodeURIComponent(lastTimestamp)}`);
        if (!response.ok) throw new Error('Failed to fetch new messages');

        const data = await response.json();
        if (data.error || data.message === "No previous messages for customer") return;

        const newCustomerMap = {};
        data.forEach(msg => {
          if (msg.type !== 'message') return;
          const parsedTime = parseBankTimestamp(msg.date).toISOString();
          if (parsedTime <= lastTimestamp) return;

          const custId = msg.custID1;
          const custName = msg.custName;
          if (!newCustomerMap[custId]) newCustomerMap[custId] = [];
          newCustomerMap[custId].push({
            content: msg.message,
            isCustomer: msg.sender.toLowerCase() === 'customer',
            type: msg.type,
            timestamp: parsedTime
          });
        });

        // Build updated list first, then set + refresh counts
        let updatedCustomers;
        setCustomers(prevCustomers => {
          updatedCustomers = [...prevCustomers];
          Object.keys(newCustomerMap).forEach(custId => {
            const existingIndex = updatedCustomers.findIndex(c => c.id === custId);
            if (existingIndex !== -1) {
              const customer = { ...updatedCustomers[existingIndex] };
              customer.messages = [...customer.messages, ...newCustomerMap[custId]];
              customer.messages.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
              const lastMsg = customer.messages[customer.messages.length - 1];
              customer.lastMessage = lastMsg.content;
              customer.lastMessageTime = formatDate(lastMsg.timestamp);
              // Keep unreadCount authoritative; we'll refresh via API below.
              updatedCustomers.splice(existingIndex, 1);
              updatedCustomers.unshift(customer);
            } else {
              const messages = newCustomerMap[custId];
              const newCustomer = {
                id: custId,
                name: (data.find(d => d.custID1 === custId)?.custName) || `Customer ${custId}`,
                lastMessage: messages[messages.length - 1].content,
                lastMessageTime: formatDate(messages[messages.length - 1].timestamp),
                status: "online",
                unreadCount: 0, // will refresh via API
                messages
              };
              updatedCustomers.unshift(newCustomer);
            }
          });
          return updatedCustomers;
        });

        // Refresh unread counts after update (authoritative)
        if (updatedCustomers && updatedCustomers.length) {
          refreshUnreadCountsForAll(updatedCustomers);
        }

        const allNewTimestamps = Object.values(newCustomerMap).flat().map(m => m.timestamp);
        if (allNewTimestamps.length > 0) {
          const newLatest = allNewTimestamps.sort().pop();
          setLastTimestamp(newLatest);
        }
      } catch (error) {
        console.error('Error fetching new messages:', error);
      }
    };

    const handleIncomingMessage = (message) => {
      if (message.type === 'message' || message.type === 'cust-alert') {
        const customerId = message.customerId;
        const customerName = message.customerName || `Customer ${customerId}`;

        setCustomers(prevCustomers => {
          const idx = prevCustomers.findIndex(c => c.id === customerId);
          if (idx !== -1) {
            const updated = [...prevCustomers];
            const customer = { ...updated[idx] };
            customer.messages = [...customer.messages, {
              content: message.content,
              isCustomer: true,
              type: message.type,
              timestamp: message.timestamp || new Date().toISOString()
            }];
            customer.lastMessage = message.content;
            customer.lastMessageTime = formatDate(message.timestamp || new Date().toISOString());
            updated.splice(idx, 1);
            updated.unshift(customer);
            return updated;
          } else {
            const newCustomer = {
              id: customerId,
              name: customerName,
              lastMessage: message.content,
              lastMessageTime: formatDate(message.timestamp || new Date().toISOString()),
              status: "online",
              unreadCount: 0, // will be refreshed via API soon
              messages: [{
                content: message.content,
                isCustomer: true,
                type: message.type,
                timestamp: message.timestamp || new Date().toISOString()
              }]
            };
            return [newCustomer, ...prevCustomers];
          }
        });

        if (selectedCustomer && message.customerId === selectedCustomer.id) {
          setSelectedCustomer(prev => ({
            ...prev,
            messages: [...prev.messages, {
              content: message.content,
              isCustomer: true,
              type: message.type,
              timestamp: message.timestamp || new Date().toISOString()
            }],
            lastMessage: message.content,
            lastMessageTime: formatDate(message.timestamp || new Date().toISOString())
          }));
        }

        // Refresh counts for accuracy
        refreshUnreadCountsForAll(customers);
      }
    };

    const handleCustomerSelect = async (customer) => {
      setSelectedCustomer(customer);

      // Immediately zero the badge in UI for that customer
      setCustomers(prev =>
        prev.map(c => c.id === customer.id ? { ...c, unreadCount: 0 } : c)
      );

      // NEW: mark read on server when banker opens the chat
      try {
        const url = `http://10.177.141.86:7001/ChatServer/updateMsgReadStatus?custId=${encodeURIComponent(customer.id)}&branchCode=${encodeURIComponent(branchCode)}&reqFrom=bank`;
        const resp = await fetch(url);
        if (!resp.ok) throw new Error('Failed to update read status');
        // Optionally re-pull only this customer's count (should be 0)
        // const count = await getUnreadCount(customer.id);
        // setCustomers(prev => prev.map(c => c.id === customer.id ? { ...c, unreadCount: count } : c));
      } catch (e) {
        console.error('updateMsgReadStatus error', e);
      }
    };

    const sendMessage = () => {
      if (!inputMessage.trim() || !selectedCustomer) return;

      const messageData = {
        type: 'message',
        content: inputMessage.trim(),
        customerId: selectedCustomer.id,
        sender: 'bank',
        timestamp: new Date().toISOString(),
        customerName: selectedCustomer.name,
        branchCode: branchCode,
        role: 'banker',
        msgSrc: 'EE-CE'
      };

      const success = window.bankWebSocket?.safeSend?.(messageData);
      if (!success) {
        console.warn('Failed to send message - queued or connection issue');
      }

      const newMessage = {
        content: inputMessage.trim(),
        isCustomer: false,
        type: 'message',
        timestamp: messageData.timestamp
      };

      setSelectedCustomer(prev => prev ? ({
        ...prev,
        messages: [...prev.messages, newMessage],
        lastMessage: inputMessage.trim(),
        lastMessageTime: formatDate(messageData.timestamp)
      }) : prev);

      setCustomers(prev =>
        prev.map(c => c.id === selectedCustomer.id
          ? { ...c, messages: [...c.messages, newMessage], lastMessage: inputMessage.trim(), lastMessageTime: formatDate(messageData.timestamp) }
          : c
        )
      );

      setInputMessage('');
    };

    const handleKeyPress = (e) => {
      if (e.key === 'Enter') sendMessage();
    };

    const scrollToBottom = () => {
      messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
    };

    // Poll every 10s
    useEffect(() => {
      if (!lastTimestamp || !tellerId || !branchCode) return;
      const interval = setInterval(fetchNewMessages, 10000);
      return () => clearInterval(interval);
    }, [lastTimestamp, tellerId, branchCode]);

    useEffect(() => { scrollToBottom(); }, [selectedCustomer?.messages]);

    const submitNewQA = async () => {
      if (!newQuestion.trim() || !newAnswer.trim()) return;
      const payload = new URLSearchParams();
      payload.append('question', newQuestion.trim());
      payload.append('answer', newAnswer.trim());
      payload.append('branch_code', branchCode);

      try {
        const resp = await fetch('http://10.177.141.86:7001/ChatServer/addNewQA', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: payload.toString()
        });
        if (!resp.ok) throw new Error('Failed to submit QA');
        setShowModal(false);
        setNewQuestion('');
        setNewAnswer('');
        console.log('QA added successfully');
      } catch (e) {
        console.error('Error adding QA', e);
        alert('Failed to add QA');
      }
    };

    return (
      <div className="bank-container">
        <div className="customer-list">
          <div className="customer-list-header">
            Bank Customer Support Dashboard
            <div style={{ fontSize: '0.8em', marginTop: '5px' }}>
              {customers.filter(c => c.status === 'online').length} Customers
            </div>
            <div style={{ marginTop: '8px' }}>
              <button onClick={() => setShowModal(true)}>Add Q/A</button>
            </div>
          </div>

          {customers.map(customer => (
            <div
              key={customer.id}
              className={`customer-item ${selectedCustomer?.id === customer.id ? 'active' : ''}`}
              onClick={() => handleCustomerSelect(customer)}
            >
              <div className="customer-name">
                <span className={`customer-status status-${customer.status}`}></span>
                {/* NEW: truncate by 20 words */}
                {truncateWords(customer.name, 20)}
              </div>
              <div className="customer-preview">{customer.lastMessage}</div>

              {/* Unread badge */}
              {customer.unreadCount > 0 && (
                <span style={{
                  backgroundColor: '#dc3545',
                  color: 'white',
                  borderRadius: '50%',
                  padding: '2px 6px',
                  fontSize: '0.8em',
                  float: 'right'
                }}>
                  {customer.unreadCount}
                </span>
              )}
            </div>
          ))}
        </div>

        <div className="chat-area">
          {selectedCustomer ? (
            <>
              <div className="chat-header">
                <h2>{truncateWords(selectedCustomer.name, 20)} {selectedCustomer.role ? `(${selectedCustomer.role})` : ''}</h2>
                <div style={{ fontSize: '0.9em', color: '#f8f9fa' }}>
                  {selectedCustomer.email}
                </div>
              </div>

              <div className="chat-messages">
                {selectedCustomer.messages.map((message, index) => (
                  <div key={index} className={`message ${message.isCustomer ? 'customer' : 'bank'}`}>
                    <div className={message.type === 'cust-alert' ? "cust-alert-band" : "message-content"}>
                      {message.content}
                      {message.type === 'cust-alert' && (
                        <span>{new Date(message.timestamp).toLocaleString("en-GB")}</span>
                      )}
                    </div>
                    {message.type !== 'cust-alert' && (
                      <div className="message-time">
                        {formatDate(message.timestamp)}
                      </div>
                    )}
                  </div>
                ))}
                <div ref={messagesEndRef} />
              </div>

              <div className="chat-input">
                <div className="input-container">
                  <input
                    type="text"
                    className="message-input"
                    value={inputMessage}
                    onChange={(e) => setInputMessage(e.target.value)}
                    onKeyPress={handleKeyPress}
                    placeholder="Type your response..."
                    maxLength="500"
                  />
                  <button className="send-button" onClick={sendMessage}>Send</button>
                </div>
              </div>
            </>
          ) : (
            <div className="no-customer-selected">Select a customer to start chatting</div>
          )}
        </div>

        {showModal && (
          <div className="qa-modal-overlay" style={{ position: 'fixed', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', backgroundColor: 'rgba(0,0,0,0.5)' }}>
            <div className="qa-modal" style={{ background: '#fff', padding: '16px', borderRadius: '8px', minWidth: '320px' }}>
              <h3>Add Question & Answer</h3>
              <div style={{ marginBottom: '8px' }}>
                <label>Question</label>
                <textarea value={newQuestion} onChange={(e) => setNewQuestion(e.target.value)} rows={4} style={{ width: '98%' }} />
              </div>
              <div style={{ marginBottom: '8px' }}>
                <label>Answer</label>
                <textarea value={newAnswer} onChange={(e) => setNewAnswer(e.target.value)} rows={4} style={{ width: '98%' }} />
              </div>
              <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '8px' }}>
                <button onClick={() => { setShowModal(false); }}>Cancel</button>
                <button onClick={submitNewQA}>Submit</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  };

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<BankDashboard />);
</script>
