<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Support Chat</title>
  <link rel="stylesheet" href="custStyles.css">
  <!-- React and Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Utility function to get URL parameters
    const getUrlParameter = (name) => {
      name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
      const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
      const results = regex.exec(window.location.search);
      return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    };

    // Customer Chat Component with WebSocket
    const CustomerChat = () => {
      const [messages, setMessages] = useState([]);
      const [inputMessage, setInputMessage] = useState('');
      const [connectionStatus, setConnectionStatus] = useState('connecting');
      const [ws, setWs] = useState(null);
      const [customerId, setCustomerId] = useState('');
      const [branchCode, setBranchCode] = useState('');
      const [userInfo, setUserInfo] = useState(null);
      const [isBrConnected, setIsBrConnected] = useState(false);
      const [showDefaultQuestions, setShowDefaultQuestions] = useState(false);
      const messagesEndRef = useRef(null);
      const [connAlert,setConnAlert] = useState(false);

      const defaultQuestions = [
        "Check account balance",
        "View last 5 transactions",
        "Report an issue",
        "Talk to customer support"
      ];

      // Extract URL parameters on component mount
      useEffect(() => {
        const urlCustomerId = getUrlParameter('cust_id');
        const urlBranchCode = getUrlParameter('branch_code');
        const urlCustName = getUrlParameter('cust_name');

        setCustomerId(urlCustomerId);
        setBranchCode(urlBranchCode);
        setUserInfo({
          customerId: urlCustomerId,
          branchCode: urlBranchCode,
          custName: urlCustName
        });

        
      }, []);

      const loadPreviousMessages = async (custId, brCode) => {
        try {
          const response = await fetch(`./LoadPreviousMesgs?cust_id=${custId}&branch_code=${brCode}&req_from=customer`);
          if (!response.ok) throw new Error('Failed to fetch previous messages');

          let data = await response.json();
          let formattedMessages =[];

          if(data.error == 'Invalid Customer ID Please check'){
            
            handleConnAlert();
          }else{

          let filtered = data.filter(msg => msg.custID1 === custId);
          filtered.sort((a, b) => new Date(a.date) - new Date(b.date));

          

          const formattedMessages = filtered.map(msg => ({
            content: msg.message,
            isCustomer: msg.sender.toLowerCase() === 'customer',
            senderName:msg.sender =='bank'? msg.brCode : msg.custName ,
            timestamp: msg.date
          }));
          }

          // Prepend welcome message
          setMessages([
            {
              content: "Welcome! How can we help you today?",
              isCustomer: false,
              senderName:"System",
              timestamp: new Date().toISOString()
            },
            ...formattedMessages
          ]);

          // 👉 show default questions only once after loading messages
          setShowDefaultQuestions(true);

        } catch (error) {
          console.error('Error loading previous messages:', error);
        }
      };

      const handleConnAlert = ()=> {

        alert('in handleConnAlert');

        connectWebSocket();
          const messageData = {
                    type: 'cust-alert',
                    content: 'Hello Branch user, A customer ('+customerId+', '+userInfo?.custName+') is connected to the Chat support !',
                    customerId: customerId,
                    branchCode: branchCode,
                    sender: 'system',
                    timestamp: new Date().toISOString(),
                    customerName: userInfo?.custName || ''    
                };

                ws.send(JSON.stringify(messageData));
      }

      // WebSocket connection
      useEffect(() => {
        if (!customerId || !branchCode) return;

        connectWebSocket();

        // Load previous messages from servlet
        loadPreviousMessages(customerId, branchCode);

        

        return () => {
          if (ws) ws.close();
        };
      }, [customerId, branchCode]);

      const connectWebSocket = () => {
          try {
            //const websocket = new WebSocket(`ws://localhost:8080/ChatboxEECE/chatServer`);
			const websocket = new WebSocket(`ws://10.177.141.86:7001/ChatboxEECE/chatServer`);

            websocket.onopen = () => {
              setConnectionStatus('connected');
              websocket.send(JSON.stringify({
                type: 'register',
                role: 'customer',
                customerId: customerId,
                branchCode: branchCode,
                customerName: userInfo?.custName || ''
              }));
            };

            websocket.onmessage = (event) => {
              const message = JSON.parse(event.data);
              handleIncomingMessage(message);
            };

            websocket.onclose = () => {
              setConnectionStatus('disconnected');
              setTimeout(connectWebSocket, 3000);
            };

            websocket.onerror = (error) => {
              console.error('Customer WebSocket error:', error);
              setConnectionStatus('error');
            };

            setWs(websocket);
          } catch (error) {
            console.error('Failed to create customer WebSocket:', error);
            setConnectionStatus('error');
          }
        };

      const handleIncomingMessage = (message) => {
        if (message.customerId != customerId) return;
        if (message.type === 'message') {
          const newMessage = {
            content: message.content,
            isCustomer: message.sender === 'customer',
            timestamp: message.timestamp || new Date().toISOString()
          };
          setMessages(prev => [...prev, newMessage]);
          setIsBrConnected(true);
        } else {
          handleBotResponse(message); // Handle bot responses
        }
      };

      const handleBotResponse = (message) => {
        console.log("Received bot response:", message); // Debugging log
        if (message.type === 'ANSWER') {
          const newMessage = {
            content: message.answer,
            senderName : "System",
            isCustomer: false,
            timestamp: new Date().toISOString()
          };
          console.log("Adding ANSWER message:", newMessage); // Debugging log
          setMessages(prev => [...prev, newMessage]);
        } else if (message.type === 'COUNTER_FLOW') {
          const flowOptions = message.flow.map((option, index) => (
            <button key={index} className="question-btn" onClick={() => sendMessage(option)}>
              {option}
            </button>
          ));
          setMessages(prev => [...prev, {
            content: flowOptions,
            senderName : "System",
            isCustomer: false,
            timestamp: new Date().toISOString()
          }]);
        } else if (message.type === 'HUMAN') {
          const newMessage = {
            content: message.answer,
            senderName : "System",
            isCustomer: false,
            timestamp: new Date().toISOString()
          };
          setMessages(prev => [...prev, newMessage]);
        }
      };


      const handleOutGoingMsg = (text) => {
                if (!text.trim() || !ws || ws.readyState !== WebSocket.OPEN) return;

                const messageData = {
                    type: 'message',
                    content: text.trim(),
                    customerId: customerId,
                    branchCode: branchCode,
                    sender: 'customer',
                    timestamp: new Date().toISOString(),
                    customerName: userInfo?.custName || ''    
                };

                ws.send(JSON.stringify(messageData));

                // Add message to local state
                const newMessage = {
                    content: text.trim(),
                    isCustomer: true,
                    timestamp: messageData.timestamp
                };

                setMessages(prev => [...prev, newMessage]);
                setInputMessage('');
            };

      const handleOutGoingBotMsg = async (text) => {
        if (!text.trim()) return;

        try {
          const response = await fetch('./getBotReply', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ question: text.trim() })
          });

          if (!response.ok) throw new Error('Failed to fetch bot reply');

          const message = await response.json();

          const newMessage = {
            content: text.trim(),
            senderName : userInfo.custName,
            isCustomer: true,
            timestamp: new Date().toISOString()
          };

          setMessages(prev => [...prev, newMessage]);

          const parsedMessage = JSON.parse(message);
         
          handleBotResponse(parsedMessage);
         
          setInputMessage('');
        } catch (error) {
          console.error('Error sending message:', error);
        }
      };

       const sendMessage = async (text) => {
        if (!text.trim()) return;

        try {
          if(!isBrConnected){
			  handleOutGoingBotMsg(text);
		  }else{
			  handleOutGoingMsg(text);
		  }
        } catch (error) {
          console.error('Error sending message:', error);
        }
      };

      const handleKeyPress = (e) => {
        if (e.key === 'Enter') sendMessage(inputMessage);
      };

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages]);

      const handleDefaultQuestionClick = (question) => {
        sendMessage(question);
        setShowDefaultQuestions(false); // remove buttons after selection
      };

      return (
        <div className="chat-container">
          <div className="chat-header">
            <h2>Customer Support Chat</h2>
            {userInfo && (
              <div className="user-info">
                Customer Name: {userInfo.custName} | Branch: SBIN00{userInfo.branchCode}
              </div>
            )}
            <div className={`connection-status status-${connectionStatus}`}>
              {connectionStatus === 'connected' && 'Connected to support'}
              {connectionStatus === 'disconnected' && 'Disconnected - Reconnecting...'}
              {connectionStatus === 'connecting' && 'Connecting...'}
              {connectionStatus === 'error' && 'Connection Error'}
            </div>
          </div>

          <div className="chat-messages">
            {messages.map((message, index) => (
              <div key={index} className={`message ${message.isCustomer ? 'customer' : 'bank'}`}>
                <div className="message-sender">{message.senderName}</div>
                <div className="message-content">{message.content}</div>
                <div className="message-time">
                  {new Date(message.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                </div>
              </div>
            ))}

            {/* Default questions only on first load */}
            {showDefaultQuestions && (
              <div className="default-questions">
                {defaultQuestions.map((q, i) => (
                  <button key={i} className="question-btn" onClick={() => handleDefaultQuestionClick(q)}>
                    {q}
                  </button>
                ))}
              </div>
            )}

            <div ref={messagesEndRef} />
          </div>

          <div className="chat-input">
            <div className="input-container">
              <input
                type="text"
                className="message-input"
                value={inputMessage}
                onChange={(e) => setInputMessage(e.target.value)}
                onKeyPress={handleKeyPress}
                placeholder="Type your message..."
                maxLength="500"
                disabled={connectionStatus !== 'connected'}
              />
              <button
                className="send-button"
                onClick={() => sendMessage(inputMessage)}
                disabled={!inputMessage.trim() || connectionStatus !== 'connected'}
              >
                Send
              </button>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CustomerChat />);
  </script>


</body>

</html>
