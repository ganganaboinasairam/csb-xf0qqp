<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML Generator</title>
</head>
<body>
    <h1>XML File Generator</h1>
    <form id="xmlForm">
        <!-- Input fields -->
        <label>CUSTREF: <input type="text" id="CUSTREF" required></label><br>
        <label>LCNUMBER: <input type="text" id="LCNUMBER" required></label><br>
        <label>ETRADEREF: <input type="text" id="ETRADEREF" required></label><br>
        <label>GOODS: <input type="text" id="GOODS" required></label><br>
        <label>CONTRACT_TYPE: <input type="text" id="CONTRACT_TYPE" required></label><br>
        <label>IREPSVENDORCODE: <input type="text" id="IREPSVENDORCODE" required></label><br>
        <label>BENENAME: <input type="text" id="BENENAME" required></label><br>
        <label>ADVBKNM: <input type="text" id="ADVBKNM" required></label><br>
        <label>ADVBKADD: <input type="text" id="ADVBKADD" required></label><br>
        <label>CONTRACT_DETAIL: <input type="text" id="CONTRACT_DETAIL" required></label><br>
        <label>IFSC: <input type="text" id="IFSC" required></label><br>
        <label>LCVAL: <input type="text" id="LCVAL" required></label><br>
        <label>LCDATE: <input type="date" id="LCDATE" required></label><br>
        <label>LCVALDATE: <input type="date" id="LCVALDATE" required></label><br>
        <label>LCTYPE: <input type="number" id="LCTYPE" required></label><br>
        <label>CREATEDBY: <input type="text" id="CREATEDBY" required></label><br>
        <label>MAKER-DESIGNATION: <input type="text" id="MAKER-DESIGNATION" required></label><br>
        <label>MAKER-MOBNO: <input type="text" id="MAKER-MOBNO" required></label><br>
        <label>RELEASEDBY: <input type="text" id="RELEASEDBY" required></label><br>
        <label>CHECKER-DESIGNATION: <input type="text" id="CHECKER-DESIGNATION" required></label><br>
        <label>CHECKER-MOBNO: <input type="text" id="CHECKER-MOBNO" required></label><br>
        <label>BENEBKNAME: <input type="text" id="BENEBKNAME" required></label><br>
        <label>BENEBKIFSC: <input type="text" id="BENEBKIFSC" required></label><br>
        <label>BENEBKACCOUNT: <input type="text" id="BENEBKACCOUNT" required></label><br>
        <button type="button" onclick="generateXML()">Submit</button>
    </form>
    <script>
        function generateXML() {
            const formData = {};
            const form = document.getElementById("xmlForm");
            Array.from(form.elements).forEach(input => {
                if (input.id) {
                    formData[input.id] = input.value.trim();
                }
            });

            // Validate ACCUNIT
            if (formData.ETRADEREF.length >= 10) {
                formData.ACCUNIT = formData.ETRADEREF.substring(7, 10);
            } else {
                alert("ETRADEREF must have at least 10 characters.");
                return;
            }

            // Determine filename
            const LCTYPE = parseFloat(formData.LCTYPE);
            const LCNUMBER = formData.LCNUMBER;
            let fileName = "";
            if (LCTYPE === 0) {
                fileName = `LC_Issue${LCNUMBER}.xml`;
            } else {
                fileName = `LC_Amend_${LCTYPE.toFixed(2)}${LCNUMBER}.xml`;
            }

            // Generate XML
            const xmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<data>
    <row>
        ${Object.keys(formData).map(key => `<${key}>${formData[key]}</${key}>`).join("\n        ")}
    </row>
</data>`;

            // Download XML file
            const blob = new Blob([xmlContent], { type: "application/xml" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = fileName;
            a.click();
        }
    </script>
</body>
</html>
