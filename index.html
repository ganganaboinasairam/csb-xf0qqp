<!-- inside topframe.html -->
<button id="infoBtn">i</button>

<script>
document.getElementById("infoBtn").addEventListener("click", function() {
  // Get reference to mainframe window
  let mainFrameWin = parent.frames["mainframe"];

  // Access its document
  let mainDoc = mainFrameWin.document;

  // Check if iframe already exists
  let popup = mainDoc.getElementById("infoFrame");
  if (!popup) {
    popup = mainDoc.createElement("iframe");
    popup.id = "infoFrame";
    popup.src = "yourpage.html";
    popup.style.cssText = `
      position: fixed;
      top: 60px;
      right: 20px;
      width: 400px;
      height: 300px;
      border: 1px solid #ccc;
      background: white;
      z-index: 9999;
    `;
    mainDoc.body.appendChild(popup);
  } else {
    // Toggle visibility
    popup.style.display = popup.style.display === "none" ? "block" : "none";
  }
});
</script>
