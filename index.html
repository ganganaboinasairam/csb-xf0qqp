<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

<script type="text/babel">

function formatDate(dateStr) {
  // Example input: "18-Sep-25 05.22.09.44683 PM +05:30"

  // Convert dots in time part to colons (for Date parsing)
  let normalized = dateStr.replace(/(\d+)\.(\d+)\.(\d+)/, "$1:$2:$3");

  // Remove extra microseconds (".44683")
  normalized = normalized.replace(/\.\d+/, "");

  // Create Date object
  let date = new Date(normalized);

  if (isNaN(date)) {
    return dateStr; // fallback
  }

  // Format -> dd/MM/yyyy, HH:mm:ss
  let day = String(date.getDate()).padStart(2, "0");
  let month = String(date.getMonth() + 1).padStart(2, "0");
  let year = date.getFullYear();
  let hours = String(date.getHours()).padStart(2, "0");
  let minutes = String(date.getMinutes()).padStart(2, "0");
  let seconds = String(date.getSeconds()).padStart(2, "0");

  return `${day}/${month}/${year}, ${hours}:${minutes}:${seconds}`;
}

function App() {
  const rawDate = "18-Sep-25 05.22.09.44683 PM +05:30";
  return (
    <div>
      <p>Original: {rawDate}</p>
      <p>Formatted: {formatDate(rawDate)}</p>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));

</script>
