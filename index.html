<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IR File Tracker</title>
</head>
<body>
  <div class="container">
    <div class="right-pannel">
      <h1>IR File Tracker</h1>
      <div class="top">
        <input type="text" id="irInput" />
        <button id="fetchBtn" onclick="runFetch()">Fetch</button>
      </div>
      <div class="status" id="status">
        Enter IR number(s)
      </div>
      <div id="results" style="display:none;">
        <div class="toolbar">
          <div>
            Files: <span id="count">0</span>
          </div>
          <div>
            <button onclick="copyAll()">Copy</button>
            <button onclick="toggleRaw()">Raw</button>
            <button onclick="clearResults()">Clear</button>
          </div>
        </div>
        <div class="search">
          <input type="text" id="searchInput" placeholder="Search files..." oninput="filterFiles()" />
        </div>
        <div class="file-list" id="fileList"></div>
      </div>
    </div>
    <div class="left-pannel">
      <div style="margin-bottom:10px;">
        <button onclick="generatePromoterMail()">
          Generate Promoter Mail
        </button>
      </div>
      <textarea id="promoterBox" class="mail-cont" placeholder="Generated promoter mail content..."></textarea>
      <div class="raw" id="rawBox"></div>
    </div>
  </div>
  <script>
    const BASE = 'https://irtracking.statebanktimes.in';
    const CGI = BASE + '/CGI/Get%20Details/getCompsFromNewJournal_TF.cgi?ir=';
    const LIST = BASE + '/TMP/Component_List_NEWPVCS_TF.txt';
    const IR_DTLS = BASE + '/CGI/Utilities/GetSubjectline.cgi?ir=';
    async function getIRDetails(irNumber) {
      const url = `${IR_DTLS}${irNumber}`;
      const response = await fetch(url, {
        mode: 'no-cors',
        cache: 'no-store'
      });
      const html = await response.text();
      // IR Number
      const irMatch = html.match(/IR Number:\s*(\d+)/i);
      // Status
      const statusMatch = html.match(/STATUS:\s*([^<]+)/i);
      // Description
      const descMatch = html.match(/(IR\s+\d+[\s\S]*?UAT-HASH)/i);
      return {
        irNumber: irMatch ? irMatch[1].trim() : null,
        description: descMatch ? descMatch[1].trim() : null,
        status: statusMatch ? statusMatch[1].trim() : null
      };
    }
    let allFiles = [];
    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }
    function renderFiles(files) {
      const list = document.getElementById('fileList');
      if (!files.length) {
        list.innerHTML = '<div class="empty">No files found</div>';
        return;
      }
      list.innerHTML = files.map((f, index) => `
    <div class="file-item">
      <input
        type="checkbox"
        class="file-check"
        value="${f}"
        id="f${index}"
      />
      <label for="f${index}" style="flex:1;cursor:pointer;">
        ${f}
      </label>
    </div>
  `).join('');
    }
    function filterFiles() {
      const q = document
        .getElementById('searchInput')
        .value
        .toLowerCase();
      renderFiles(
        allFiles.filter(f =>
          f.toLowerCase().includes(q)
        )
      );
    }
    function copyAll() {
      navigator.clipboard.writeText(allFiles.join('\n'));
      setStatus('Copied to clipboard');
    }
    function clearResults() {
      allFiles = [];
      document.getElementById('results').style.display = 'none';
      setStatus('Cleared');
    }
    function toggleRaw() {
      const box = document.getElementById('rawBox');
      box.style.display =
        box.style.display === 'block'
          ? 'none'
          : 'block';
    }
    function generatePromoterMail() {
      const checked = [
        ...document.querySelectorAll('.file-check:checked')
      ];
      if (!checked.length) {
        setStatus('Select at least one file');
        return;
      }
      const irRaw = document
        .getElementById('irInput')
        .value
        .trim();
      const irNumber = irRaw
        .split(/[\s,]+/)[0];
      const lines = checked.map(c => {
        let file = c.value;
        file = file.replace(/Regiongroups/gi, 'TRADEFINST6');
        return `${file}`
          .replace(/\s+/g, ' ')
          .trim();
      });
      const output =
        `Special Instructions : Overridebranch
${lines.join('\n')}`;
      document.getElementById('promoterBox').value = output;
      setStatus('Promoter mail generated');
    }
    async function runFetch() {
      const raw = document
        .getElementById('irInput')
        .value
        .trim();
      if (!raw) {
        setStatus('Enter IR number');
        return;
      }
      const btn = document.getElementById('fetchBtn');
      btn.disabled = true;
      const irs = raw
        .split(/[\s,]+/)
        .filter(Boolean);
      const param = irs
        .map(encodeURIComponent)
        .join('%2C');
      setStatus('Triggering CGI...');
      try {
        await fetch(CGI + param, {
          mode: 'no-cors',
          cache: 'no-store'
        });
      } catch (e) { }
      await new Promise(r => setTimeout(r, 800));
      setStatus('Fetching file list...');
      try {
        const resp = await fetch(
          LIST + '?t=' + Date.now(),
          { cache: 'no-store' }
        );
        if (!resp.ok) {
          throw new Error(resp.status);
        }
        const text = await resp.text();
        allFiles = text
          .split('\n')
          .map(v => v.trim())
          .filter(Boolean);
        document.getElementById('count').textContent =
          allFiles.length;
        document.getElementById('rawBox').textContent =
          text;
        renderFiles(allFiles);
        document.getElementById('results').style.display =
          'block';
        setStatus('Done');
      } catch (e) {
        setStatus('Failed: ' + e.message);
      }
      btn.disabled = false;
    }
    document
      .getElementById('irInput')
      .addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          runFetch();
        }
      });
  </script>
</body>
</html>
