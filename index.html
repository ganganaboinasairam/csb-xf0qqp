<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Utility Dashboard</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial,sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        flex-direction:column;
        overflow:hidden;
    }

    .topbar{
        height:60px;
        background:#1e293b;
        display:flex;
        align-items:center;
        gap:10px;
        padding:10px;
        border-bottom:2px solid #0f172a;
    }

    .topbar button{
        padding:10px 18px;
        border:none;
        border-radius:6px;
        background:#334155;
        color:white;
        cursor:pointer;
        transition:0.2s;
    }

    .topbar button:hover{
        background:#475569;
    }

    .topbar button.active{
        background:#2563eb;
    }

    .content{
        flex:1;
    }

    iframe{
        width:100%;
        height:100%;
        border:none;
        background:white;
    }
</style>
</head>

<body>

<div class="topbar">
    <button onclick="loadPage(this,'tools/sql-generator.html')" class="active">
        SQL Tool
    </button>

    <button onclick="loadPage(this,'tools/tracker.html')">
        Tracker
    </button>

    <button onclick="loadPage(this,'tools/mq-tool.html')">
        MQ Tool
    </button>

    <button onclick="loadPage(this,'tools/report.html')">
        Reports
    </button>
</div>

<div class="content">
    <iframe id="toolFrame" src="tools/sql-generator.html"></iframe>
</div>

<script>
    function loadPage(button, page){

        document.querySelectorAll(".topbar button")
            .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        document.getElementById("toolFrame").src = page;
    }
</script>

</body>
</html>
