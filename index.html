<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Workflow Flowchart Generator</title>

<script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>

<style>

body{
font-family:Arial;
background:#f4f6f8;
padding:20px;
}

textarea{
width:100%;
height:200px;
padding:10px;
font-family:monospace;
font-size:13px;
}

button{
margin-top:10px;
padding:10px 20px;
background:#2b7ce9;
color:white;
border:none;
cursor:pointer;
}

#cy{
margin-top:20px;
width:100%;
height:700px;
border:1px solid #aaa;
background:white;
}

</style>

</head>

<body>

<h2>Workflow Flowchart Generator</h2>

<textarea id="jsonInput" placeholder="Paste SQL JSON result here"></textarea>

<br>

<button onclick="generateFlow()">Generate Flowchart</button>

<div id="cy"></div>

<script>

function generateFlow(){

let jsonText = document.getElementById("jsonInput").value;

let json;

try{
json = JSON.parse(jsonText);
}catch(e){
alert("Invalid JSON");
return;
}

let rows = json.results[0].items;

let nodes = {};
let edges = [];
let edgeSet = new Set();

rows.forEach(r => {

let fromId = r.i_step_seq_no + "_" + r.i_func_seq_no;
let toId = r.i_to_step_no + "_" + r.i_to_func_no;

// create source node

if(!nodes[fromId]){

nodes[fromId] = {
data:{
id:fromId,
label:
r.c_step_name +
"\n" +
r.c_func_desc +
"\n(" + r.c_func_id + ")"
}
};

}

// create target node

if(!nodes[toId]){

nodes[toId] = {
data:{
id:toId,
label:
r.c_to_step_name +
"\n" +
r.c_to_func_desc +
"\n(" + r.c_to_func_id + ")"
}
};

}

// remove duplicate edges

let key = fromId + "_" + toId;

if(!edgeSet.has(key)){
edgeSet.add(key);

edges.push({
data:{
source:fromId,
target:toId
}
});
}

});

let elements = Object.values(nodes).concat(edges);

let cy = cytoscape({

container: document.getElementById('cy'),

elements: elements,

style: [

{
selector:'node',
style:{
'label':'data(label)',
'text-wrap':'wrap',
'text-valign':'center',
'text-halign':'center',
'background-color':'#2b7ce9',
'color':'white',
'width':'170',
'height':'80',
'font-size':'10px'
}
},

{
selector:'edge',
style:{
'curve-style':'bezier',
'target-arrow-shape':'triangle',
'line-color':'#777',
'target-arrow-color':'#777',
'width':2
}
}

],

layout:{
name:'breadthfirst',
directed:true,
padding:20
}

});

}

</script>

</body>
</html>
