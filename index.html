<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Large File Splitter</title>

<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family: Arial, sans-serif;
        background:#f4f6f9;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:20px;
    }

    .container{
        width:800px;
        background:white;
        border-radius:12px;
        padding:30px;
        box-shadow:0 4px 20px rgba(0,0,0,0.1);
    }

    .title{
        font-size:28px;
        font-weight:bold;
        margin-bottom:25px;
        color:#222;
    }

    .form-group{
        margin-bottom:20px;
    }

    .label{
        display:block;
        margin-bottom:8px;
        font-weight:bold;
        color:#444;
    }

    .input{
        width:100%;
        padding:12px;
        border:1px solid #ccc;
        border-radius:8px;
        font-size:14px;
        outline:none;
        transition:0.2s;
    }

    .input:focus{
        border-color:#1976d2;
        box-shadow:0 0 0 3px rgba(25,118,210,0.15);
    }

    .button-row{
        display:flex;
        gap:15px;
        margin-top:10px;
    }

    .btn{
        padding:12px 20px;
        border:none;
        border-radius:8px;
        cursor:pointer;
        font-size:14px;
        font-weight:bold;
        transition:0.2s;
    }

    .primary-btn{
        background:#1976d2;
        color:white;
    }

    .primary-btn:hover{
        background:#1259a7;
    }

    .secondary-btn{
        background:#e0e0e0;
    }

    .secondary-btn:hover{
        background:#cfcfcf;
    }

    .output-container{
        margin-top:30px;
    }

    .output-title{
        font-size:18px;
        font-weight:bold;
        margin-bottom:10px;
        color:#333;
    }

    .output-box{
        width:100%;
        height:250px;
        background:#111827;
        color:#00ff88;
        border-radius:10px;
        padding:15px;
        overflow:auto;
        font-family:Consolas, monospace;
        font-size:13px;
        white-space:pre-wrap;
        border:1px solid #333;
    }

    .status{
        margin-top:15px;
        font-size:14px;
        font-weight:bold;
    }

    .success{
        color:green;
    }

    .error{
        color:red;
    }

</style>
</head>

<body>

<div class="container">

    <div class="title">
        Large File Splitter
    </div>

    <div class="form-group">
        <label class="label">
            Large File Path
        </label>

        <input type="text"
               id="inputFilePath"
               class="input"
               placeholder="E:\\files\\large.txt">
    </div>

    <div class="form-group">
        <label class="label">
            Output Folder Path
        </label>

        <input type="text"
               id="outputFolderPath"
               class="input"
               placeholder="E:\\output">
    </div>

    <div class="form-group">
        <label class="label">
            Lines Per File
        </label>

        <input type="number"
               id="linesPerFile"
               class="input"
               value="20000">
    </div>

    <div class="button-row">

        <button class="btn primary-btn"
                onclick="splitFile()">
            Split File
        </button>

        <button class="btn secondary-btn"
                onclick="clearOutput()">
            Clear Output
        </button>

    </div>

    <div id="status" class="status"></div>

    <div class="output-container">

        <div class="output-title">
            Console Output
        </div>

        <div id="outputBox" class="output-box">
Application logs will appear here...
        </div>

    </div>

</div>

<script>

    function log(message){

        const outputBox =
            document.getElementById("outputBox");

        const currentTime =
            new Date().toLocaleTimeString();

        outputBox.innerHTML +=
            `[${currentTime}] ${message}\n`;

        outputBox.scrollTop =
            outputBox.scrollHeight;
    }

    function clearOutput(){

        document.getElementById("outputBox")
            .innerHTML = "";

        document.getElementById("status")
            .innerHTML = "";
    }

    async function splitFile(){

        const inputFilePath =
            document.getElementById(
                "inputFilePath"
            ).value.trim();

        const outputFolderPath =
            document.getElementById(
                "outputFolderPath"
            ).value.trim();

        const linesPerFile =
            document.getElementById(
                "linesPerFile"
            ).value.trim();

        const status =
            document.getElementById("status");

        if(!inputFilePath){
            alert("Enter input file path");
            return;
        }

        if(!outputFolderPath){
            alert("Enter output folder path");
            return;
        }

        if(!linesPerFile || linesPerFile <= 0){
            alert("Enter valid lines count");
            return;
        }

        status.innerHTML = "";
        log("Starting file split process...");
        log("Input File : " + inputFilePath);
        log("Output Path : " + outputFolderPath);
        log("Lines Per File : " + linesPerFile);

        try{

            const response =
                await fetch("split-file", {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    inputFilePath:
                        inputFilePath,

                    outputFolderPath:
                        outputFolderPath,

                    linesPerFile:
                        linesPerFile
                })
            });

            const result =
                await response.text();

            log(result);

            status.innerHTML =
                "Operation Completed";

            status.className =
                "status success";

        }catch(error){

            log("ERROR : " + error.message);

            status.innerHTML =
                "Operation Failed";

            status.className =
                "status error";
        }
    }

</script>

</body>
</html>
