<!DOCTYPE html>
<html>
	<head>
		<style>
			.modal{
				display: none;
				position: fixed;
				z-index: 1000;
				left: 0;
				top: 0;
				width: 100%;
				height: 100%;
				background: rgba(0,0,0,0,5);
			}
			.modal-content{
				background: #fff;
				width: 450px;
				margin: 8% auto;
				padding: 20px;
				border-radius: 6px;
				box-shadow: 0 0 10px #666;
			}
			.modal-content input{
				width: 100%;
				box-sizing: border-box;
				padding: 8px;
			}
			.close{
				float: right;
				font-size: 24px;
				cursor: pointer;
			}
		</style>
	</head>
<body>
	<h2>Jar Updater</h2>
	<button onclick="openProjectPopup()">Add Project</button>
	<select id='project'></select>
	<br>
	<br>
	<input id='search' placeholder='Search class'>
	<br>
	<br>
	<div id='classes'  style='width: 700px;height: 400px;overflow: auto;border: 1px solid #ccc;'></div>
	<br>
	<br>
	<button onclick='updateJar()'>Backup & Update</button>
	<div id='msg'></div>
	<div id="projectModal" class="modal">
	<div class="modal-content">
		<span class="close" onclick="closeProjectPopup()">&times;</span>
		<input id="pid" placeholder="Project ID"/><br><br>
		<input id="pname" placeholder="Project Name"/><br><br>
		<input id="pworkspace" placeholder="Project bin Folder Path"/><br><br>
		<input id="psrc" placeholder="Project Source Folder Path"/><br><br>
		<input id="pjar" placeholder="JAR Path"/><br><br>
		<button onclick="saveProject()">Save</button>
		<button onclick="closeProjectPopup()">Cancel</button>
	</div>
	</div>
	<script>
let all=[];
fetch('../api/projects').then(r=>r.json()).then(d=>{
 let p=document.getElementById('project');
 d.forEach(x=>p.add(new Option(x.name,x.id)));
 load();
});
function load(){
 fetch('../api/classes?projectId='+project.value).then(r=>r.json()).then(d=>{all=d;fill(d);});
}

function openProjectPopup(){
	document.getElementById("projectModal").style.display="block";
}

function closeProjectPopup(){
	document.getElementById("projectModal").style.display="none";
}

function saveProject(){
	fetch("../api/addProject",{
		method:"POST",
		headers:{
			"Content-type":"application/json"
		},
		body:JSON.stringify({
			id:pid.value,
			name:pname.value,
			workspace:pworkspace.value,
			srcPath:psrc.value,
			jarPath:pjar.value
		})
		
	}).then(r=>r.text())
		.then(
			t=>{
				alert(t);
				closeProjectPopup();
				load();
			}
		)
}

project.onchange=load;
function fill(a){
	classes.innerHTML='';
	a.forEach(x=>{
		let div = document.createElement("div");
		div.innerHTML = "<label>" + "<input type='checkbox' value='"+x+"'>"+x+"</label>";
		classes.appendChild(div);
	});
	}

	function getSelectedClasses(){
		let arr = [];
		document.querySelectorAll("#classes input[type=checkbox]:checked").forEach(c=>arr.push(c.value));
		return arr;
	}

search.onkeyup=()=>fill(all.filter(x=>x.toLowerCase().includes(search.value.toLowerCase())));

function updateJar(){

	let selected = getSelectedClasses();

	if(selected.length == 0){
		alert("select at least one class");
		return;
	}


 fetch('../api/updateJar',{
	method:'POST',
	headers:{
		'Content-Type':'application/json'
	},
 body:JSON.stringify({
	projectId:project.value,
	classFiles:selected
 })
})
 .then(r=>r.text())
 .then(t=>msg.innerHTML=t);
}
</script>
</body>
</html>
